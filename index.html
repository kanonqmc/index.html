const markers = [];\n    markers.push(`<div class=\"timeline-marker mk-kickoff\" style=\"left:${pct(k)}%\" title=\"Kickoff: ${fmtDate(r.kickoff)}\"><\u002Fdiv>`);\n    if (sh) markers.push(`<div class=\"timeline-marker mk-ship\" style=\"left:${pct(sh)}%\" title=\"Ship date: ${fmtDate(r.ship)}\"><\u002Fdiv>`);\n    if (pe) markers.push(`<div class=\"timeline-marker mk-planend\" style=\"left:${pct(pe)}%\" title=\"Planned end: ${fmtDate(r.planEnd)}\"><\u002Fdiv>`);\n    if (rel) markers.push(`<div class=\"timeline-marker mk-released\" style=\"left:${pct(rel)}%\" title=\"Released: ${fmtDate(r.released)}\"><\u002Fdiv>`);\n    const todayPct = pct(TODAY);\n    const isOverdue = !rel && sh && TODAY.getTime() > sh.getTime();\n    const fillPct = rel ? 100 : todayPct;\n    const todayMarker = !rel ? `<div class=\"timeline-today\" style=\"left:${todayPct}%\"><span class=\"tt-label\">Today<\u002Fspan><\u002Fdiv>` : '';\n    return `\n      <div class=\"timeline-track\">\n        <div class=\"timeline-fill ${isOverdue?'overdue':''}\" style=\"width:${fillPct}%\"><\u002Fdiv>\n        ${markers.join('')}\n        ${todayMarker}\n      <\u002Fdiv>\n      <div class=\"timeline-legend\">\n        <span class=\"sw\"><span class=\"box\" style=\"background:var(--ink-2);\"><\u002Fspan>Kickoff ${fmtDate(r.kickoff)}<\u002Fspan>\n        ${sh?`<span class=\"sw\"><span class=\"box\" style=\"background:var(--gold);\"><\u002Fspan>Ship ${fmtDate(r.ship)}<\u002Fspan>`:''}\n        ${pe?`<span class=\"sw\"><span class=\"box\" style=\"background:var(--hold);\"><\u002Fspan>Planned end ${fmtDate(r.planEnd)}<\u002Fspan>`:''}\n        ${rel?`<span class=\"sw\"><span class=\"box\" style=\"background:var(--good);\"><\u002Fspan>Released ${fmtDate(r.released)}<\u002Fspan>`:''}\n      <\u002Fdiv>`;\n  }\n\n  \u002F\u002F ---------- financials section ----------\n  function finSectionHtml(r){\n    const f = r.fin;\n    if (!f) return `<div class=\"no-invoices\">No financial data available for this project.<\u002Fdiv>`;\n    const cur = 'EUR';\n    const hasMargin = f.marginPct !== null && f.marginPct !== undefined;\n    const marginText = hasMargin ? `${(f.marginPct*100).toFixed(1)}%` : '—';\n    const marginWarn = hasMargin && f.marginPct < 0.10;\n    const resultWarn = (f.result || 0) < 0;\n    const contractAmt = r.aanneemsom || 0;\n    const invoicedPct = contractAmt > 0 ? Math.max(0, Math.min(100, ((f.invoiced||0) \u002F contractAmt) * 100)) : 0;\n    return `\n      <div class=\"fin-grid\">\n        <div class=\"fin-tile\"><div class=\"label\">Invoiced<\u002Fdiv><div class=\"value\">${fmtMoney(f.invoiced, cur)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile\"><div class=\"label\">Still to invoice<\u002Fdiv><div class=\"value\">${fmtMoney(f.toInvoice, cur)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile\"><div class=\"label\">Cost booked<\u002Fdiv><div class=\"value\">${fmtMoney(f.costTotal, cur)}<\u002Fdiv><div class=\"sub\">${fmtMoney(f.costMaterial, cur)} material · ${fmtMoney(f.costHours, cur)} labor<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile ${resultWarn?'warn':''}\"><div class=\"label\">Result<\u002Fdiv><div class=\"value\">${fmtMoney(f.result, cur)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile ${marginWarn?'warn':''}\"><div class=\"label\">Margin<\u002Fdiv><div class=\"value\">${marginText}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fin-progress-track\"><div class=\"fin-progress-fill ${invoicedPct>=100?'over':''}\" style=\"width:${Math.min(invoicedPct,100)}%\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"fin-progress-label\">${fmtMoney(f.invoiced, cur)} invoiced of ${fmtMoney(contractAmt, cur)} contract value${contractAmt>0?` (${invoicedPct.toFixed(0)}%)`:''}<\u002Fdiv>\n    `;\n  }\n\n  \u002F\u002F ---------- production (Gema \u002F Ridder iQ) section ----------\n  function prodSectionHtml(r){\n    const p = r.prod;\n    if (!p) return `<div class=\"no-invoices\">No matching subcontractor production order found for this project number.<\u002Fdiv>`;\n    const cur = 'EUR';\n    const hoursOver = p.hoursEst > 0 && p.hoursBooked > p.hoursEst;\n    const costOver = p.costEst > 0 && p.costBooked > p.costEst;\n    const ordersHtml = p.orders.map(o => `\n      <tr>\n        <td>${escapeHtml(String(o.ordernr))}<\u002Ftd>\n        <td>${escapeHtml(o.desc || '—')}<\u002Ftd>\n        <td>${fmtDate(o.orderDate)}<\u002Ftd>\n        <td>${fmtDate(o.deliveryDate)}<\u002Ftd>\n        <td class=\"num\">${Math.round(o.hoursBooked)}h${o.hoursEst ? ` <span style=\"color:var(--ink-muted);\">\u002F ${Math.round(o.hoursEst)}h<\u002Fspan>` : ''}<\u002Ftd>\n        <td class=\"num\">${fmtMoney(o.costBooked, cur)}<\u002Ftd>\n      <\u002Ftr>`).join('');\n    return `\n      <div class=\"fin-grid\">\n        <div class=\"fin-tile ${hoursOver?'warn':''}\"><div class=\"label\">Production hours<\u002Fdiv><div class=\"value\">${fmtInt(Math.round(p.hoursBooked))}h<\u002Fdiv><div class=\"sub\">of ${fmtInt(Math.round(p.hoursEst))}h estimated<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile ${costOver?'warn':''}\"><div class=\"label\">Production cost booked<\u002Fdiv><div class=\"value\">${fmtMoney(p.costBooked, cur)}<\u002Fdiv><div class=\"sub\">of ${fmtMoney(p.costEst, cur)} estimated<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile\"><div class=\"label\">Material<\u002Fdiv><div class=\"value\">${fmtMoney(p.costMaterial, cur)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile\"><div class=\"label\">Labor<\u002Fdiv><div class=\"value\">${fmtMoney(p.costLabor, cur)}<\u002Fdiv><\u002Fdiv>\n        <div class=\"fin-tile\"><div class=\"label\">Outsourced<\u002Fdiv><div class=\"value\">${fmtMoney(p.costOutsourced, cur)}<\u002Fdiv><\u002Fdiv>\n        ${Math.abs(p.costMisc) >= 1 ? `<div class=\"fin-tile\"><div class=\"label\">Misc \u002F adjustments<\u002Fdiv><div class=\"value\">${fmtMoney(p.costMisc, cur)}<\u002Fdiv><\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      <table class=\"inv-table\" style=\"margin-top:4px;\">\n        <thead><tr><th>Order #<\u002Fth><th>Description<\u002Fth><th>Order date<\u002Fth><th>Delivery date<\u002Fth><th>Hours booked \u002F est.<\u002Fth><th>Cost booked<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${ordersHtml}<\u002Ftbody>\n      <\u002Ftable>\n      <div class=\"fin-progress-label\" style=\"margin-top:8px;\">Matched to project ${escapeHtml(r.nr)} via the ERP's \"customer order number\" field — this is the subcontractor's manufacturing hours and cost, separate from the Eng. hours figure above.<\u002Fdiv>\n    `;\n  }\n\n  \u002F\u002F ---------- customer context ----------\n  function customerContextHtml(r){\n    const others = ROWS.filter(x => x.klant === r.klant && x.id !== r.id);\n    if (others.length === 0){\n      return `<div class=\"cust-context\">No other active projects for this customer right now.<\u002Fdiv>`;\n    }\n    const totalValue = others.reduce((s,x) => s + (x.aanneemsom || 0), 0);\n    const openInvoices = others.reduce((s,x) => s + (x.inv||[]).filter(i => !i.paid).length, 0);\n    return `<div class=\"cust-context\"><strong>${others.length}<\u002Fstrong> other active project${others.length===1?'':'s'} for this customer (across all types), worth <strong>${fmtMoney(totalValue,'EUR')}<\u002Fstrong> combined${openInvoices?`, with <strong>${openInvoices}<\u002Fstrong> open invoice${openInvoices===1?'':'s'} across them`:''}.<\u002Fdiv>`;\n  }\n\n  \u002F\u002F ---------- Set-Up: activity schedule + materials (reconstructed from a Trimergo screenshot) ----------\n  function setupSectionHtml(r){\n    const s = r.setup;\n    if (!s) return '';\n\n    const actRows = s.activities.map(a => `\n      <tr class=\"lvl${a.lvl}${a.root ? ' act-root' : ''}\">\n        <td class=\"act-desc\">\n          ${a.group ? `<span class=\"tree-toggle\">${a.open === false ? '▶' : '▲'}<\u002Fspan>` : ''}\n          <span>${escapeHtml(a.desc)}<\u002Fspan>\n        <\u002Ftd>\n        <td class=\"mono\">${escapeHtml(a.start || '—')}<\u002Ftd>\n        <td class=\"act-status\" title=\"${escapeAttr(a.status || '')}\">${escapeHtml(a.status || '')}<\u002Ftd>\n        <td><span class=\"chk${a.materials ? ' on' : ''}\"><\u002Fspan><\u002Ftd>\n        <td class=\"mono\">${escapeHtml(a.end || '—')}<\u002Ftd>\n        <td class=\"mono\">H ${a.hoursEst || 0}<\u002Ftd>\n      <\u002Ftr>`).join('');\n\n    const matRows = s.materials.map(m => `\n      <tr class=\"${m.additional ? 'mat-additional' : ''}\">\n        <td class=\"mono\">${escapeHtml(String(m.line))}<\u002Ftd>\n        <td class=\"mono\">${escapeHtml(String(m.m))}<\u002Ftd>\n        <td>${escapeHtml(m.itemType)}<\u002Ftd>\n        <td class=\"mono\">${escapeHtml(m.bom)}<\u002Ftd>\n        <td>${escapeHtml(m.desc)}<\u002Ftd>\n        <td class=\"num mono\">${escapeHtml(m.qty)}<\u002Ftd>\n        <td><\u002Ftd>\n      <\u002Ftr>`).join('');\n\n    const dot = (color) => `<span class=\"dot ${color}\"><\u002Fspan>`;\n\n    return `\n      <div class=\"modal-section-title\">Set-Up — Schedule &amp; Materials<\u002Fdiv>\n      <div class=\"setup-info-row\">\n        <span><strong>Customer:<\u002Fstrong> ${escapeHtml(s.customerFull)}<\u002Fspan>\n        <span>${dot(s.margin)}Margin<\u002Fspan>\n        <span>${dot(s.plan)}Plan<\u002Fspan>\n        <span>${dot(s.budget)}Budget<\u002Fspan>\n        <span><strong>Reputation damage risk:<\u002Fstrong> ${escapeHtml(s.reputationRisk)}<\u002Fspan>\n        <span><strong>Complex:<\u002Fstrong> ${escapeHtml(s.complex)}<\u002Fspan>\n        <span><strong>EPC:<\u002Fstrong> ${escapeHtml(s.epc)}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"setup-grid\">\n        <div class=\"setup-pane\">\n          <div class=\"setup-pane-head\">Activity schedule<\u002Fdiv>\n          <div class=\"setup-table-wrap\">\n            <table class=\"activity-table\">\n              <thead><tr><th>Description<\u002Fth><th>Start<\u002Fth><th>Status<\u002Fth><th>Mat.<\u002Fth><th>End<\u002Fth><th>Hrs est.<\u002Fth><\u002Ftr><\u002Fthead>\n              <tbody>${actRows}<\u002Ftbody>\n            <\u002Ftable>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"setup-pane\">\n          <div class=\"mat-tabs\">\n            <span class=\"mat-tab active\">Materials (${s.materials.length - 1})<\u002Fspan>\n            <span class=\"mat-tab\">Expense Reports (0)<\u002Fspan>\n            <span class=\"mat-tab\">Hours (${s.hoursCount || 0})<\u002Fspan>\n            <span class=\"mat-tab\">Outsourcing<\u002Fspan>\n            <span class=\"mat-tab\">Details (Activity)<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"setup-table-wrap\">\n            <table class=\"materials-table\">\n              <thead><tr><th>Li.<\u002Fth><th>M.<\u002Fth><th>Item Type<\u002Fth><th>Item\u002FBOM<\u002Fth><th>Description<\u002Fth><th>Quant.<\u002Fth><th>Purchase<\u002Fth><\u002Ftr><\u002Fthead>\n              <tbody>${matRows}<\u002Ftbody>\n            <\u002Ftable>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"setup-note\">Reconstructed for ${escapeHtml(r.nr)} — this schedule\u002Fmaterials breakdown isn't part of the live data pull behind the rest of this dashboard, so it won't refresh automatically.<\u002Fdiv>\n    `;\n  }\n\n  let detailReturnTo = null;\n\n  function openDetail(id, opts){\n    const r = ROWS_BY_ID[id];\n    if (!r) return;\n    detailReturnTo = (opts && opts.fromPM) ? 'pm' : null;\n    document.getElementById('detailBack').hidden = !detailReturnTo;\n    document.getElementById('detailTitle').textContent = `${r.nr} — ${r.desc}`;\n    document.getElementById('detailSub').textContent = `${r.klant} · ${r.group}${r.type ? ' · ' + r.type : ''}`;\n\n    const fields = [\n      ['Project manager', escapeHtml(r.pm), false],\n      ['Customer', escapeHtml(r.klant), false],\n      ['Status', statusPillHtml(r), true],\n      ['Stage', r.onhold ? 'On hold' : `${r.stage}% (indicative)`, false],\n      ['Order date', fmtDate(r.fin && r.fin.orderDate), true],\n      ['Kickoff', fmtDate(r.kickoff), true],\n      ['Ship date', fmtDate(r.ship), true],\n      ['Planned end', fmtDate(r.planEnd), true],\n      ['Released', fmtDate(r.released), true],\n      ['Contract amount', fmtMoney(r.aanneemsom, 'EUR'), true],\n      ['Eng. hours (pre-calc \u002F booked)', `${Math.round(r.voorcalc||0)}h \u002F ${Math.round(r.geboekt||0)}h`, true],\n    ];\n    const detailGridHtml = fields.map(([label, value, mono]) => `\n      <div class=\"detail-field\">\n        <div class=\"dlabel\">${label}<\u002Fdiv>\n        <div class=\"dvalue${mono ? ' mono' : ''}\">${value}<\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    const invs = r.inv || [];\n    let invHtml;\n    if (invs.length === 0){\n      invHtml = `<div class=\"no-invoices\">No invoices found for this project.<\u002Fdiv>`;\n    } else {\n      const totalAmt = invs.reduce((s,i)=>s+(i.amt||0), 0);\n      const totalOpen = invs.reduce((s,i)=>s+(i.paid ? 0 : (i.open||0)), 0);\n      const openCount = invs.filter(i=>!i.paid).length;\n      const cur = invs[0].cur || 'EUR';\n      invHtml = `\n        <div class=\"inv-summary\">\n          <span><strong>${invs.length}<\u002Fstrong> invoice${invs.length===1?'':'s'}<\u002Fspan>\n          <span><strong>${fmtMoney(totalAmt, cur)}<\u002Fstrong> total invoiced<\u002Fspan>\n          <span><strong>${openCount}<\u002Fstrong> still open, <strong>${fmtMoney(totalOpen, cur)}<\u002Fstrong> outstanding<\u002Fspan>\n        <\u002Fdiv>\n        <table class=\"inv-table\">\n          <thead><tr>\n            <th>Invoice #<\u002Fth><th>Description<\u002Fth><th>Terms<\u002Fth><th>Date<\u002Fth><th>Due date<\u002Fth><th>Amount<\u002Fth><th>Status<\u002Fth><th>Outstanding<\u002Fth><th>Aging<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>${invs.map(invoiceRowHtml).join('')}<\u002Ftbody>\n        <\u002Ftable>`;\n    }\n\n    document.querySelector('#detailOverlay .modal').classList.toggle('wide', !!r.setup);\n\n    document.getElementById('detailBody').innerHTML = `\n      ${riskFlagsHtml(r)}\n      <div class=\"modal-section-title\">Project details<\u002Fdiv>\n      <div class=\"detail-grid\">${detailGridHtml}<\u002Fdiv>\n      ${customerContextHtml(r)}\n      ${r.setup ? setupSectionHtml(r) : ''}\n      <div class=\"modal-section-title\">Timeline<\u002Fdiv>\n      ${timelineHtml(r) || '<div class=\"no-invoices\">No kickoff date on file — timeline unavailable.<\u002Fdiv>'}\n      <div class=\"modal-section-title\">Financials<\u002Fdiv>\n      ${finSectionHtml(r)}\n      ${r.prod ? `<div class=\"modal-section-title\">Production (subcontractor)<\u002Fdiv>${prodSectionHtml(r)}` : ''}\n      <div class=\"modal-section-title\">Invoices<\u002Fdiv>\n      ${invHtml}\n    `;\n    document.getElementById('detailOverlay').hidden = false;\n  }\n\n  function closeDetail(){\n    document.getElementById('detailOverlay').hidden = true;\n    detailReturnTo = null;\n  }\n\n  function goBackFromDetail(){\n    document.getElementById('detailOverlay').hidden = true;\n    if (detailReturnTo === 'pm'){\n      document.getElementById('pmOverlay').hidden = false;\n    }\n    detailReturnTo = null;\n  }\n\n  tbody.addEventListener('click', (e) => {\n    const tr = e.target.closest('tr[data-id]');\n    if (tr) openDetail(tr.dataset.id);\n  });\n  document.getElementById('detailClose').addEventListener('click', closeDetail);\n  document.getElementById('detailBack').addEventListener('click', goBackFromDetail);\n  document.getElementById('detailOverlay').addEventListener('click', (e) => {\n    if (e.target.id === 'detailOverlay') closeDetail();\n  });\n\n  \u002F\u002F ---------- PM -> project list popup (from the \"Active projects by PM\" chart) ----------\n  function openPMProjects(pm){\n    const projects = getScopedRows().filter(r => r.pm === pm).slice().sort((a,b) => {\n      const av = a.ship || '', bv = b.ship || '';\n      if (av !== bv) return av < bv ? -1 : 1;\n      return 0;\n    });\n    document.getElementById('pmTitle').textContent = pm;\n    document.getElementById('pmSub').textContent = `${projects.length} active project${projects.length===1?'':'s'} — click one for full details`;\n\n    if (projects.length === 0){\n      document.getElementById('pmBody').innerHTML = '<p style=\"color:var(--ink-muted); padding:10px 2px;\">No active projects for this PM in the current scope.<\u002Fp>';\n      document.getElementById('pmOverlay').hidden = false;\n      return;\n    }\n\n    \u002F\u002F Each project as one compact line — number and description together\n    \u002F\u002F rather than stacked — with its own kickoff-to-ship Gantt bar on the\n    \u002F\u002F same line, all sharing one time axis (reusing the same span\u002Fcolour\n    \u002F\u002F logic as the Milestones tab's timeline).\n    const withSpan = projects.map(r => ({ r, span: msBarSpan(r) })).filter(x => x.span);\n    const withoutSpan = projects.filter(r => !msBarSpan(r));\n    let bodyHtml = '';\n\n    if (withSpan.length > 0){\n      let winStart = new Date(TODAY.getTime() - 30*86400000);\n      let winEnd = new Date(TODAY.getTime() + 30*86400000);\n      withSpan.forEach(({span}) => {\n        if (span.start < winStart) winStart = span.start;\n        if (span.end > winEnd) winEnd = span.end;\n      });\n      const capStart = new Date(TODAY.getTime() - 730*86400000);\n      if (winStart < capStart) winStart = capStart;\n      const capEnd = new Date(TODAY.getTime() + 730*86400000);\n      if (winEnd > capEnd) winEnd = capEnd;\n      const winDays = Math.max(daysBetween(winEnd, winStart), 1);\n      const pct = d => {\n        const clamped = d < winStart ? winStart : (d > winEnd ? winEnd : d);\n        return daysBetween(clamped, winStart) \u002F winDays * 100;\n      };\n      const months = [];\n      let cursor = new Date(winStart.getFullYear(), winStart.getMonth(), 1);\n      if (cursor < winStart) cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n      while (cursor <= winEnd){\n        months.push(new Date(cursor));\n        cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n      }\n      const monthsHtml = months.map(m => `<span style=\"left:${ganttTrackPos(pct(m), 316)};\">${MONTH_ABBR[m.getMonth()]} ${String(m.getFullYear()).slice(2)}<\u002Fspan>`).join('') +\n        `<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 316)};\"><span class=\"tt-label\">Today<\u002Fspan><\u002Fdiv>`;\n      const rowsHtml = withSpan.map(({r, span}) => {\n        const eff = msEffectiveEnd(r);\n        const rightLabel = r.released ? `Done ${fmtDate(r.released)}` : fmtDate(eff ? (eff.field === 'ship' ? r.ship : r.planEnd) : null);\n        return `\n          <div class=\"gantt-row pm-list-row\" data-id=\"${escapeAttr(r.id)}\">\n            <div class=\"gantt-label pm-proj-label\" title=\"${escapeAttr(r.nr + ' — ' + r.desc)}\"><span class=\"nr\">${escapeHtml(r.nr)}<\u002Fspan><span class=\"desc-inline\">${escapeHtml(r.desc)}<\u002Fspan><\u002Fdiv>\n            <div class=\"gantt-status-num ${statusClass(r)}\" title=\"${escapeAttr(r.status)}\">${r.code}<\u002Fdiv>\n            <div class=\"gantt-track\">${renderGanttBarHtml(r, span, pct)}<\u002Fdiv>\n            <div class=\"gantt-hours\">${rightLabel}<\u002Fdiv>\n          <\u002Fdiv>`;\n      }).join('');\n      bodyHtml += `<div class=\"gantt-wrap\"><div class=\"gantt-months\">${monthsHtml}<\u002Fdiv><div class=\"gantt-rows\"><div style=\"position:relative;\">${rowsHtml}<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 316)};\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n    }\n\n    if (withoutSpan.length > 0){\n      bodyHtml += `<p style=\"color:var(--ink-muted); font-size:11px; padding:12px 2px 4px;\">${withoutSpan.length} project${withoutSpan.length===1?'':'s'} missing a kickoff\u002Forder date or a ship\u002Fplanned-end date, so no timeline bar:<\u002Fp>` +\n        withoutSpan.map(r => `\n          <div class=\"pm-list-row\" data-id=\"${escapeAttr(r.id)}\" style=\"padding:7px 2px; display:flex; align-items:center; gap:10px;\">\n            <span class=\"nr\" style=\"font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--ink);\">${escapeHtml(r.nr)}<\u002Fspan>\n            <span class=\"gantt-status-num ${statusClass(r)}\" title=\"${escapeAttr(r.status)}\" style=\"flex:0 0 auto;\">${r.code}<\u002Fspan>\n            <span style=\"color:var(--ink-2); font-size:11.5px;\">${escapeHtml(r.desc)}<\u002Fspan>\n          <\u002Fdiv>`).join('');\n    }\n\n    document.getElementById('pmBody').innerHTML = bodyHtml;\n    document.getElementById('pmOverlay').hidden = false;\n  }\n  function closePMProjects(){\n    document.getElementById('pmOverlay').hidden = true;\n  }\n  document.getElementById('pmBody').addEventListener('click', (e) => {\n    const row = e.target.closest('.pm-list-row[data-id]');\n    if (row){ closePMProjects(); openDetail(row.dataset.id, {fromPM:true}); }\n  });\n  document.getElementById('pmClose').addEventListener('click', closePMProjects);\n  document.getElementById('pmOverlay').addEventListener('click', (e) => {\n    if (e.target.id === 'pmOverlay') closePMProjects();\n  });\n  document.getElementById('pmChart').addEventListener('click', (e) => {\n    const row = e.target.closest('.bar-row[data-pm]');\n    if (row) openPMProjects(row.dataset.pm);\n  });\n\n  document.addEventListener('keydown', (e) => {\n    if (e.key !== 'Escape') return;\n    if (!document.getElementById('detailOverlay').hidden){\n      if (detailReturnTo === 'pm') goBackFromDetail(); else closeDetail();\n    } else if (!document.getElementById('pmOverlay').hidden){\n      closePMProjects();\n    }\n  });\n\n  \u002F\u002F ---------- charts ----------\n  let chartsRendered = false;\n  function renderCharts(){\n    if (chartsRendered) return;\n    chartsRendered = true;\n    const scoped = getScopedRows();\n\n    \u002F\u002F Active projects by PM — every PM with at least one matching project,\n    \u002F\u002F not just the top 15; a PM with none in scope simply doesn't appear.\n    const pmCounts = {};\n    scoped.forEach(r => { pmCounts[r.pm] = (pmCounts[r.pm]||0)+1; });\n    const pmSorted = Object.entries(pmCounts).sort((a,b)=>b[1]-a[1]);\n    const maxPM = Math.max(...pmSorted.map(p=>p[1]),1);\n    document.getElementById('pmChart').innerHTML = pmSorted.map(([pm,c]) => `\n      <div class=\"bar-row clickable\" data-pm=\"${escapeAttr(pm)}\">\n        <div class=\"bar-label\" title=\"${pm}\">${pm}<\u002Fdiv>\n        <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${c\u002FmaxPM*100}%; background:var(--gold-hover);\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"bar-value tab-nums\">${c}<\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    \u002F\u002F Ship date urgency (already-released projects are excluded from the urgency read — they've shipped)\n    const buckets = {'Released':0,'On hold':0,'Overdue':0,'Due in 0-14 days':0,'Due in 15-30 days':0,'Later \u002F on track':0,'No ship date':0};\n    scoped.forEach(r => {\n      if (r.released) buckets['Released']++;\n      else if (r.onhold) buckets['On hold']++;\n      else if (r.shipDaysLeft === null) buckets['No ship date']++;\n      else if (r.shipDaysLeft < 0) buckets['Overdue']++;\n      else if (r.shipDaysLeft <= 14) buckets['Due in 0-14 days']++;\n      else if (r.shipDaysLeft <= 30) buckets['Due in 15-30 days']++;\n      else buckets['Later \u002F on track']++;\n    });\n    const bucketColor = {'Released':'var(--ink-muted)','Overdue':'var(--critical)','Due in 0-14 days':'var(--warning)','Due in 15-30 days':'var(--serious)','Later \u002F on track':'var(--good)','On hold':'var(--hold)','No ship date':'#c8c6bd'};\n    const maxBucket = Math.max(...Object.values(buckets),1);\n    document.getElementById('shipChart').innerHTML = Object.entries(buckets).filter(([,c])=>c>0).map(([b,c]) => `\n      <div class=\"bar-row\">\n        <div class=\"bar-label\">${b}<\u002Fdiv>\n        <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${c\u002FmaxBucket*100}%; background:${bucketColor[b]};\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"bar-value tab-nums\">${c}<\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    \u002F\u002F Active projects by status\n    const statusCounts = {};\n    scoped.forEach(r => { statusCounts[r.status] = (statusCounts[r.status]||0)+1; });\n    const statusSorted = Object.entries(statusCounts).sort((a,b)=>{\n      const ca = parseFloat(a[0]), cb = parseFloat(b[0]);\n      return ca - cb;\n    });\n    const maxStatus = Math.max(...statusSorted.map(s=>s[1]),1);\n    document.getElementById('statusChart').innerHTML = statusSorted.map(([s,c]) => `\n      <div class=\"bar-row\">\n        <div class=\"bar-label\" title=\"${s}\">${s}<\u002Fdiv>\n        <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${c\u002FmaxStatus*100}%; background:${s==='35 ON HOLD'?'var(--hold)':'var(--ink-muted)'};\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"bar-value tab-nums\">${c}<\u002Fdiv>\n      <\u002Fdiv>`).join('');\n  }\n\n  \u002F\u002F ---------- Milestones tab ----------\n  \u002F\u002F A flat, sortable table of every project's key dates — order date\n  \u002F\u002F (Trimergo's Opdrachtdatum), kickoff, ship date, planned end and released\n  \u002F\u002F — alongside PM\u002Fcustomer\u002Fstatus, so the whole timeline for a project (or\n  \u002F\u002F for a PM's whole book) is scannable in one place without opening each\n  \u002F\u002F project's detail modal.\n  let milestonesRendered = false;\n  let msAllRows = [];\n  let msFiltered = [];\n  let msSortKey = 'ship', msSortDir = 1;\n\n  function buildMilestoneRows(){\n    const showAllTypes = document.getElementById('ms-f-showall').checked;\n    const base = showAllTypes ? ROWS : ROWS.filter(isPO);\n    return base;\n  }\n\n  function sortMsRows(){\n    msFiltered.sort((a,b) => {\n      let av = a[msSortKey], bv = b[msSortKey];\n      if (av === null || av === undefined) av = '';\n      if (bv === null || bv === undefined) bv = '';\n      return compareRowValues(av, bv, msSortKey) * msSortDir;\n    });\n  }\n\n  \u002F\u002F The flat sortable table this tab used to show below the Timeline was\n  \u002F\u002F dropped — the Gantt above is now the only (and the scrollable) view of\n  \u002F\u002F these rows, so all that's left to keep in sync here is the empty-state\n  \u002F\u002F message and the \"X of Y projects\" count.\n  function updateMsSummary(){\n    document.getElementById('msEmptyState').hidden = msFiltered.length !== 0;\n    document.getElementById('msResultCount').textContent = msFiltered.length + ' of ' + msAllRows.length + ' projects';\n  }\n\n  \u002F\u002F Kickoff-to-ship (falling back to order date \u002F planned end) timeline bar\n  \u002F\u002F per project, grouped by PM the same way the PM Workload tab's schedule\n  \u002F\u002F is, but covering every status here (including on-hold and released\n  \u002F\u002F projects) rather than only open work, since this is a milestones view\n  \u002F\u002F rather than a remaining-capacity one.\n  \u002F\u002F A project's ship date is sometimes a stale\u002Foriginal commitment that has\n  \u002F\u002F since been superseded by a later Planned end (the project was replanned\n  \u002F\u002F further out, but the old Ship date field was never cleared). Treating\n  \u002F\u002F that stale Ship date as the target would wrongly flag a project as\n  \u002F\u002F overdue even though its current Planned end is still in the future.\n  \u002F\u002F So: when both dates exist, trust whichever is LATER — that's the most\n  \u002F\u002F recent known target and supersedes an earlier one. Only fall back to\n  \u002F\u002F whichever single date exists when the other is missing.\n  \u002F\u002F The month-tick ruler and the \"Today\" line are drawn in a container that\n  \u002F\u002F spans the FULL row width (label column + track + date column), but\n  \u002F\u002F every project's bar is positioned relative to only its .gantt-track,\n  \u002F\u002F which starts after a fixed-width label column and ends before a\n  \u002F\u002F fixed-width date column. A plain X% left therefore puts the ruler\u002Fline\n  \u002F\u002F X% of the way across the whole row instead of X% of the way across the\n  \u002F\u002F track, visibly misaligning it from the bars beneath it (a bar could sit\n  \u002F\u002F entirely before today and still end up drawn past the \"Today\" line).\n  \u002F\u002F This computes the equivalent position within the wider container so it\n  \u002F\u002F lines up with the track exactly, whatever the row's label width is.\n  \u002F\u002F leadPx is everything to the left of .gantt-track in that row (the\n  \u002F\u002F label column plus any element between it and the track, each with its\n  \u002F\u002F own .gantt-row gap); trailPx defaults to the .gantt-hours date column\n  \u002F\u002F (92px) plus its gap, since every gantt row here ends with one.\n  function ganttTrackPos(pctVal, leadPx, trailPx){\n    if (trailPx === undefined) trailPx = 92 + 10;\n    return `calc(${leadPx}px + (${pctVal} \u002F 100) * (100% - ${leadPx + trailPx}px))`;\n  }\n\n  function msEffectiveEnd(r){\n    const sh = parseYMD(r.ship);\n    const pe = parseYMD(r.planEnd);\n    if (sh && pe) return pe > sh ? { date: pe, field: 'planEnd' } : { date: sh, field: 'ship' };\n    if (sh) return { date: sh, field: 'ship' };\n    if (pe) return { date: pe, field: 'planEnd' };\n    return null;\n  }\n\n  function msBarSpan(r){\n    const start = parseYMD(r.kickoff) || parseYMD(r.orderDate);\n    const eff = msEffectiveEnd(r);\n    const end = eff ? eff.date : null;\n    if (!start || !end) return null;\n    return { start, end: end > start ? end : new Date(start.getTime() + 86400000) };\n  }\n\n  function msBarClass(r){\n    if (r.onhold) return 'hold';\n    if (r.released) return 'done';\n    const eff = msEffectiveEnd(r);\n    return (eff && eff.date < TODAY) ? 'overdue' : 'ontrack';\n  }\n\n  \u002F\u002F The date where the blue \"extended\" segment should begin: the Ship date,\n  \u002F\u002F but only when a later Planned end actually pushes the bar past it (the\n  \u002F\u002F same condition msEffectiveEnd() uses to prefer planEnd over ship). No\n  \u002F\u002F ship date, no planEnd, or planEnd not later than ship — nothing to\n  \u002F\u002F split, so this returns null and the bar stays a single segment.\n  function msExtensionStart(r){\n    const eff = msEffectiveEnd(r);\n    if (!eff || eff.field !== 'planEnd') return null;\n    return parseYMD(r.ship);\n  }\n\n  \u002F\u002F Draws one project's bar into its .gantt-track: a single segment in the\n  \u002F\u002F normal status colour, or — when Planned end has been pushed out past\n  \u002F\u002F the Ship date — that segment up to the ship date followed by a blue\n  \u002F\u002F segment for the extra time on top of it. Shared by the Milestones tab\n  \u002F\u002F and the PM project-list popup, which both use the same span\u002Fstatus\n  \u002F\u002F logic (msBarSpan\u002FmsBarClass) for their timelines.\n  function renderGanttBarHtml(r, span, pct){\n    const left = pct(span.start);\n    const rawRight = pct(span.end);\n    const cls = msBarClass(r);\n    \u002F\u002F Blue only marks an extension that is itself still ahead of us — an\n    \u002F\u002F active, on-time project whose planned end was pushed out further.\n    \u002F\u002F Once that later date has also passed, the project is simply overdue\n    \u002F\u002F (or on hold \u002F released), so it stays a single, uninterrupted colour\n    \u002F\u002F with no blue segment.\n    const extStart = cls === 'ontrack' ? msExtensionStart(r) : null;\n    if (extStart && extStart > span.start && extStart < span.end){\n      const mid = pct(extStart);\n      const mainWidth = Math.max(mid - left, 0.6);\n      const extWidth = Math.max(rawRight - (left + mainWidth), 0.6);\n      return `<div class=\"gantt-bar ${cls} seg-left\" style=\"left:${left}%; width:${mainWidth}%;\"><\u002Fdiv>` +\n             `<div class=\"gantt-bar extended seg-right\" style=\"left:${left + mainWidth}%; width:${extWidth}%;\"><\u002Fdiv>`;\n    }\n    const width = Math.max(rawRight - left, 0.6);\n    let html = `<div class=\"gantt-bar ${cls}\" style=\"left:${left}%; width:${width}%;\"><\u002Fdiv>`;\n    \u002F\u002F The reverse case: Planned end sits before the (later, authoritative)\n    \u002F\u002F Ship date. Nothing to extend the bar with, just an earlier internal\n    \u002F\u002F target inside it, so mark it with a small tick — independent of\n    \u002F\u002F on-time\u002Foverdue status, this is purely \"here's what was planned\".\n    const sh = parseYMD(r.ship);\n    const pe = parseYMD(r.planEnd);\n    if (sh && pe && pe < sh && pe > span.start && pe < span.end){\n      html += `<div class=\"gantt-plan-tick\" style=\"left:${pct(pe)}%;\" title=\"Planned end: ${fmtDate(r.planEnd)}\"><\u002Fdiv>`;\n    }\n    return html;\n  }\n\n  function renderMsGantt(){\n    const spans = msFiltered.map(r => ({ r, span: msBarSpan(r) })).filter(x => x.span);\n\n    if (spans.length === 0){\n      document.getElementById('msGanttMonths').innerHTML = '';\n      document.getElementById('msGanttRows').innerHTML = '<p style=\"color:var(--ink-muted); font-size:12.5px; padding:8px 2px;\">No projects with both a kickoff\u002Forder date and a ship\u002Fplanned-end date in the current filters.<\u002Fp>';\n      return;\n    }\n\n    let winStart = new Date(TODAY.getTime() - 30*86400000);\n    let winEnd = new Date(TODAY.getTime() + 30*86400000);\n    spans.forEach(({span}) => {\n      if (span.start < winStart) winStart = span.start;\n      if (span.end > winEnd) winEnd = span.end;\n    });\n    \u002F\u002F Clamp so one stale outlier date can't stretch the whole timeline into\n    \u002F\u002F illegibility — see the identical reasoning on the Workload tab's Gantt.\n    const capStart = new Date(TODAY.getTime() - 730*86400000);\n    if (winStart < capStart) winStart = capStart;\n    const capEnd = new Date(TODAY.getTime() + 730*86400000);\n    if (winEnd > capEnd) winEnd = capEnd;\n    const winDays = Math.max(daysBetween(winEnd, winStart), 1);\n    const pct = d => {\n      const clamped = d < winStart ? winStart : (d > winEnd ? winEnd : d);\n      return daysBetween(clamped, winStart) \u002F winDays * 100;\n    };\n\n    const months = [];\n    let cursor = new Date(winStart.getFullYear(), winStart.getMonth(), 1);\n    if (cursor < winStart) cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    while (cursor <= winEnd){\n      months.push(new Date(cursor));\n      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    }\n    document.getElementById('msGanttMonths').innerHTML =\n      months.map(m => `<span style=\"left:${ganttTrackPos(pct(m), 430)};\">${MONTH_ABBR[m.getMonth()]} ${String(m.getFullYear()).slice(2)}<\u002Fspan>`).join('') +\n      `<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 430)};\"><span class=\"tt-label\">Today<\u002Fspan><\u002Fdiv>`;\n\n    let html = '';\n    spans.forEach(({r, span}) => {\n      const eff = msEffectiveEnd(r);\n      const rightLabel = r.released ? `Done ${fmtDate(r.released)}` : fmtDate(eff ? (eff.field === 'ship' ? r.ship : r.planEnd) : null);\n      \u002F\u002F Project number, customer and PM all on one line — no separate PM\n      \u002F\u002F group headers — so the timeline stays one compact row per project.\n      html += `\n        <div class=\"gantt-row\" data-id=\"${escapeAttr(r.id)}\">\n          <div class=\"gantt-label ms-label\" title=\"${escapeAttr(r.nr + ' — ' + r.klant + ' · ' + r.pm)}\"><span class=\"nr\">${escapeHtml(r.nr)}<\u002Fspan><span class=\"desc-inline\">${escapeHtml(r.klant)}<\u002Fspan><span class=\"pm-inline\">${escapeHtml(r.pm)}<\u002Fspan><\u002Fdiv>\n          <div class=\"gantt-track\">${renderGanttBarHtml(r, span, pct)}<\u002Fdiv>\n          <div class=\"gantt-hours\">${rightLabel}<\u002Fdiv>\n        <\u002Fdiv>`;\n    });\n    document.getElementById('msGanttRows').innerHTML = `<div style=\"position:relative;\">${html}<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 430)};\"><\u002Fdiv><\u002Fdiv>`;\n  }\n\n  function applyMsFilters(){\n    const pm = document.getElementById('ms-f-pm').value;\n    const group = document.getElementById('ms-f-group').value;\n    const type = document.getElementById('ms-f-type').value;\n    const status = document.getElementById('ms-f-status').value;\n    const q = document.getElementById('ms-f-search').value.trim().toLowerCase();\n    msFiltered = msAllRows.filter(r =>\n      (!pm || r.pm===pm) &&\n      (!group || r.group===group) &&\n      (!type || r.type===type) &&\n      (!status || r.status===status) &&\n      (!q || (r.klant+' '+r.nr+' '+r.desc).toLowerCase().includes(q)) &&\n      quickFilterMatches(r)\n    );\n    sortMsRows();\n    updateMsSummary();\n    renderMsGantt();\n  }\n\n  \u002F\u002F PMs whose only active projects fall outside the current P\u002FO-or-all\n  \u002F\u002F scope shouldn't clutter the dropdown with a name that would filter the\n  \u002F\u002F table to nothing — so the PM list itself follows the same \"show all\n  \u002F\u002F project types\" checkbox as everything else on this tab.\n  function msAvailablePMs(){\n    const showAllTypes = document.getElementById('ms-f-showall').checked;\n    const scoped = showAllTypes ? ROWS : ROWS.filter(isPO);\n    return [...new Set(scoped.map(r => r.pm).filter(Boolean))].sort();\n  }\n\n  function rebuildMsScope(){\n    msAllRows = buildMilestoneRows();\n    const pmSel = document.getElementById('ms-f-pm');\n    const currentPM = pmSel.value;\n    const availablePMs = msAvailablePMs();\n    pmSel.innerHTML = '<option value=\"\">All PMs<\u002Foption>';\n    fillSelect('ms-f-pm', availablePMs);\n    \u002F\u002F If the previously selected PM no longer has any project in this\n    \u002F\u002F scope, fall back to \"All PMs\" rather than silently filtering the\n    \u002F\u002F table to zero rows with an invisible, no-longer-listed selection.\n    pmSel.value = availablePMs.includes(currentPM) ? currentPM : '';\n    applyMsFilters();\n  }\n\n  function renderMilestonesTab(){\n    if (milestonesRendered) return;\n    milestonesRendered = true;\n\n    fillSelect('ms-f-group', uniqueSorted('group'));\n    fillSelect('ms-f-type', uniqueSorted('type'));\n    fillSelect('ms-f-status', uniqueSorted('status'));\n\n    document.getElementById('ms-f-pm').addEventListener('change', applyMsFilters);\n    document.getElementById('ms-f-group').addEventListener('change', applyMsFilters);\n    document.getElementById('ms-f-type').addEventListener('change', applyMsFilters);\n    document.getElementById('ms-f-status').addEventListener('change', applyMsFilters);\n    document.getElementById('ms-f-search').addEventListener('input', applyMsFilters);\n    document.getElementById('ms-f-showall').addEventListener('change', () => {\n      document.getElementById('ms-f-search').value = '';\n      rebuildMsScope();\n    });\n    document.getElementById('msResetChip').addEventListener('click', () => {\n      document.getElementById('ms-f-pm').value = '';\n      document.getElementById('ms-f-group').value = '';\n      document.getElementById('ms-f-type').value = '';\n      document.getElementById('ms-f-status').value = '';\n      document.getElementById('ms-f-search').value = '';\n      applyMsFilters();\n    });\n    document.getElementById('msGanttRows').addEventListener('click', (e) => {\n      const row = e.target.closest('.gantt-row[data-id]');\n      if (row) openDetail(row.dataset.id);\n    });\n\n    rebuildMsScope();\n  }\n\n  \u002F\u002F ---------- PM Workload tab ----------\n  \u002F\u002F \"This quarter\" + the next 3 calendar quarters named individually, then\n  \u002F\u002F one catch-all bucket for anything further out — 6 columns total. A\n  \u002F\u002F week-by-week grid was too fine-grained to read from across a room on\n  \u002F\u002F the TV; quarters keep the same idea legible at a distance.\n  const WL_QUARTERS = 4;\n  let workloadRendered = false;\n  let wlSelectedPM = null;\n\n  function parseYMD(s){ return s ? new Date(s+'T00:00:00') : null; }\n\n  function weekStart(d){\n    const dow = (d.getDay() + 6) % 7; \u002F\u002F Monday = 0\n    const s = new Date(d);\n    s.setDate(d.getDate() - dow);\n    return s;\n  }\n\n  function quarterStart(d){\n    return new Date(d.getFullYear(), Math.floor(d.getMonth()\u002F3)*3, 1);\n  }\n\n  \u002F\u002F Spreads each project's remaining hours evenly across the days between\n  \u002F\u002F now (or kickoff, if still ahead) and its ship date, and buckets that\n  \u002F\u002F load into real calendar quarters (so each bucket is ~91 days, not a\n  \u002F\u002F fixed day count). Excludes on-hold and released\u002Ffinished projects (no\n  \u002F\u002F forward work to spread) and anything with no ship date.\n  function buildWorkloadItems(){\n    const showAllTypes = document.getElementById('wl-f-showall').checked;\n    let base = ROWS.filter(r => !r.onhold && !r.released);\n    if (!showAllTypes) base = base.filter(isPO);\n    const q0 = quarterStart(TODAY);\n    const bucketStarts = [];\n    for (let i=0;i<=WL_QUARTERS;i++){ bucketStarts.push(new Date(q0.getFullYear(), q0.getMonth()+i*3, 1)); }\n\n    const items = [];\n    base.forEach(r => {\n      const ship = parseYMD(r.ship) || parseYMD(r.planEnd);\n      if (!ship) return;\n      const kickoff = parseYMD(r.kickoff);\n      const remaining = Math.max((r.voorcalc||0) - (r.geboekt||0), 0);\n      const spreadStart = (kickoff && kickoff > TODAY) ? kickoff : TODAY;\n      const spreadEnd = ship > spreadStart ? ship : new Date(spreadStart.getTime() + 86400000);\n      const totalDays = Math.max(daysBetween(spreadEnd, spreadStart), 1);\n      const perDay = remaining \u002F totalDays;\n      const byBucket = new Array(WL_QUARTERS+1).fill(0);\n      for (let i=0;i<WL_QUARTERS;i++){\n        const bStart = bucketStarts[i], bEnd = bucketStarts[i+1];\n        const oStart = spreadStart > bStart ? spreadStart : bStart;\n        const oEnd = spreadEnd < bEnd ? spreadEnd : bEnd;\n        byBucket[i] = Math.max(daysBetween(oEnd, oStart), 0) * perDay;\n      }\n      const overflowStart = spreadStart > bucketStarts[WL_QUARTERS] ? spreadStart : bucketStarts[WL_QUARTERS];\n      byBucket[WL_QUARTERS] = Math.max(daysBetween(spreadEnd, overflowStart), 0) * perDay;\n      items.push({ r, remaining, byBucket, kickoff, ship, spreadStart, spreadEnd, perDay, tracked: (r.voorcalc||0) > 0 });\n    });\n    return { items, bucketStarts };\n  }\n\n  \u002F\u002F Thresholds scaled from the original weekly ones (~30h \u002F ~40h per week)\n  \u002F\u002F up to a ~13-week quarter, so the legend's \"h\u002Fweek average\" framing\n  \u002F\u002F still lines up with the color a bucket gets.\n  function loadClass(hours){\n    if (hours <= 0.4) return 'load-0';\n    if (hours < 390) return 'load-low';\n    if (hours <= 520) return 'load-mid';\n    return 'load-high';\n  }\n\n  const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n\n  function renderWorkloadHeatmap(items, bucketStarts){\n    const byPM = {};\n    items.forEach(({r, byBucket}) => {\n      byPM[r.pm] = byPM[r.pm] || new Array(WL_QUARTERS+1).fill(0);\n      for (let i=0;i<=WL_QUARTERS;i++) byPM[r.pm][i] += byBucket[i];\n    });\n    const pmList = Object.keys(byPM).sort((a,b) => {\n      const ta = byPM[a].reduce((s,v)=>s+v,0), tb = byPM[b].reduce((s,v)=>s+v,0);\n      return tb - ta;\n    });\n\n    const quarterLabels = bucketStarts.slice(0, WL_QUARTERS).map((d,i) => i===0 ? 'This quarter' : `Q${Math.floor(d.getMonth()\u002F3)+1} ${d.getFullYear()}`);\n    const headCells = ['PM'].concat(quarterLabels).concat(['Beyond 1yr','Total']);\n    document.getElementById('workloadHead').innerHTML = headCells.map(h => `<th>${h}<\u002Fth>`).join('');\n\n    const colCount = headCells.length;\n    if (pmList.length === 0){\n      document.getElementById('workloadTbody').innerHTML = `<tr><td colspan=\"${colCount}\" style=\"text-align:center; color:var(--ink-muted); font-family:'IBM Plex Sans',sans-serif; padding:16px;\">No active projects with remaining hours in scope right now.<\u002Ftd><\u002Ftr>`;\n      document.getElementById('workloadFoot').innerHTML = '';\n      return;\n    }\n\n    document.getElementById('workloadTbody').innerHTML = pmList.map(pm => {\n      const row = byPM[pm];\n      const total = row.reduce((s,v)=>s+v,0);\n      const cells = row.map(v => `<td class=\"load-cell ${loadClass(v)}\">${v<=0.4?'–':Math.round(v)}<\u002Ftd>`).join('');\n      return `<tr data-pm=\"${escapeAttr(pm)}\" class=\"${wlSelectedPM===pm?'pm-selected':''}\"><td class=\"pm-name\">${escapeHtml(pm)}<\u002Ftd>${cells}<td style=\"font-weight:700; color:var(--ink);\">${Math.round(total)}<\u002Ftd><\u002Ftr>`;\n    }).join('');\n\n    const totals = new Array(WL_QUARTERS+1).fill(0);\n    pmList.forEach(pm => byPM[pm].forEach((v,i) => totals[i]+=v));\n    const grandTotal = totals.reduce((s,v)=>s+v,0);\n    document.getElementById('workloadFoot').innerHTML =\n      `<td class=\"pm-name\">All PMs<\u002Ftd>${totals.map(v=>`<td>${Math.round(v)}<\u002Ftd>`).join('')}<td>${Math.round(grandTotal)}<\u002Ftd>`;\n  }\n\n  function renderWorkloadGantt(items){\n    const pmFilter = document.getElementById('wl-f-pm').value;\n    const scoped = pmFilter ? items.filter(p => p.r.pm === pmFilter) : items;\n\n    document.getElementById('wlGanttSub').textContent = pmFilter\n      ? `Kickoff-to-ship timeline for ${pmFilter}'s active projects, with remaining hours. On-hold projects aren't shown.`\n      : `Kickoff-to-ship timeline for active projects, with remaining hours. On-hold projects aren't shown — no work is being spread while they're paused.`;\n\n    if (scoped.length === 0){\n      document.getElementById('ganttMonths').innerHTML = '';\n      document.getElementById('ganttRows').innerHTML = '<p style=\"color:var(--ink-muted); font-size:12.5px; padding:8px 2px;\">No active projects with a ship date in scope right now.<\u002Fp>';\n      return;\n    }\n\n    let winStart = new Date(TODAY.getTime() - 14*86400000);\n    let winEnd = new Date(TODAY.getTime() + 30*86400000);\n    scoped.forEach(p => {\n      if (p.kickoff && p.kickoff < winStart) winStart = p.kickoff;\n      if (p.ship > winEnd) winEnd = p.ship;\n    });\n    \u002F\u002F Clamp both ends so one stale kickoff (a delayed project whose start\n    \u002F\u002F date was never re-baselined) or one far-future ship date can't\n    \u002F\u002F stretch the whole timeline into illegibility — outliers just clip to\n    \u002F\u002F the edge instead of setting the scale.\n    const capStart = new Date(TODAY.getTime() - 90*86400000);\n    if (winStart < capStart) winStart = capStart;\n    const capEnd = new Date(TODAY.getTime() + 365*86400000);\n    if (winEnd > capEnd) winEnd = capEnd;\n    const winDays = Math.max(daysBetween(winEnd, winStart), 1);\n    const pct = d => {\n      const clamped = d < winStart ? winStart : (d > winEnd ? winEnd : d);\n      return daysBetween(clamped, winStart) \u002F winDays * 100;\n    };\n\n    const months = [];\n    let cursor = new Date(winStart.getFullYear(), winStart.getMonth(), 1);\n    if (cursor < winStart) cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    while (cursor <= winEnd){\n      months.push(new Date(cursor));\n      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    }\n    document.getElementById('ganttMonths').innerHTML =\n      months.map(m => `<span style=\"left:${ganttTrackPos(pct(m), 240)};\">${MONTH_ABBR[m.getMonth()]} ${String(m.getFullYear()).slice(2)}<\u002Fspan>`).join('') +\n      `<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 240)};\"><span class=\"tt-label\">Today<\u002Fspan><\u002Fdiv>`;\n\n    const sorted = scoped.slice().sort((a,b) => a.ship - b.ship);\n    const groupByPM = !pmFilter;\n    let html = '';\n    let lastPM = null;\n    sorted.forEach(p => {\n      if (groupByPM && p.r.pm !== lastPM){\n        lastPM = p.r.pm;\n        html += `<div class=\"gantt-pm-group\">${escapeHtml(lastPM)}<\u002Fdiv>`;\n      }\n      const kStart = p.kickoff || p.ship;\n      const left = pct(kStart);\n      const width = Math.max(pct(p.ship) - left, 0.6);\n      const overdue = p.ship < TODAY;\n      const hoursText = !p.tracked ? '—' : `${Math.round(p.remaining)}h left`;\n      html += `\n        <div class=\"gantt-row\" data-id=\"${escapeAttr(p.r.id)}\">\n          <div class=\"gantt-label\"><span class=\"nr\">${escapeHtml(p.r.nr)}<\u002Fspan><span class=\"desc\" title=\"${escapeAttr(p.r.klant)}\">${escapeHtml(p.r.klant)}<\u002Fspan><\u002Fdiv>\n          <div class=\"gantt-track\"><div class=\"gantt-bar ${overdue?'overdue':'ontrack'}\" style=\"left:${left}%; width:${width}%;\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"gantt-hours\">${hoursText}<\u002Fdiv>\n        <\u002Fdiv>`;\n    });\n    document.getElementById('ganttRows').innerHTML = `<div style=\"position:relative;\">${html}<div class=\"gantt-today-line\" style=\"left:${ganttTrackPos(pct(TODAY), 240)};\"><\u002Fdiv><\u002Fdiv>`;\n  }\n\n  function refreshWorkloadTab(){\n    const { items, bucketStarts } = buildWorkloadItems();\n    const showAllTypes = document.getElementById('wl-f-showall').checked;\n    const scopeText = showAllTypes ? 'across all active projects' : 'for P\u002FO-numbered active projects';\n    document.getElementById('wlSummaryLine').textContent =\n      `${fmtInt(items.filter(p=>p.tracked).length)} active projects with tracked hours ${scopeText}.`;\n    \u002F\u002F PM options come from `items` itself (already scoped by \"show all\n    \u002F\u002F types\" and excluding on-hold\u002Freleased rows), not the full ROWS set,\n    \u002F\u002F so a PM with nothing currently in scope doesn't clutter the list.\n    const wlAvailablePMs = [...new Set(items.map(it => it.r.pm).filter(Boolean))].sort();\n    const wlPmSel = document.getElementById('wl-f-pm');\n    wlPmSel.innerHTML = '<option value=\"\">All PMs<\u002Foption>';\n    fillSelect('wl-f-pm', wlAvailablePMs);\n    if (wlSelectedPM && !wlAvailablePMs.includes(wlSelectedPM)) wlSelectedPM = null;\n    wlPmSel.value = wlSelectedPM || '';\n    renderWorkloadHeatmap(items, bucketStarts);\n    renderWorkloadGantt(items);\n  }\n\n  function renderWorkloadTab(){\n    if (workloadRendered) return;\n    workloadRendered = true;\n\n    document.getElementById('workloadTbody').addEventListener('click', (e) => {\n      const tr = e.target.closest('tr[data-pm]');\n      if (!tr) return;\n      const pm = tr.dataset.pm;\n      wlSelectedPM = (wlSelectedPM === pm) ? null : pm;\n      document.getElementById('wl-f-pm').value = wlSelectedPM || '';\n      refreshWorkloadTab();\n    });\n    document.getElementById('wl-f-pm').addEventListener('change', () => {\n      wlSelectedPM = document.getElementById('wl-f-pm').value || null;\n      refreshWorkloadTab();\n    });\n    document.getElementById('wl-f-showall').addEventListener('change', refreshWorkloadTab);\n    document.getElementById('wlResetChip').addEventListener('click', () => {\n      document.getElementById('wl-f-pm').value = '';\n      document.getElementById('wl-f-showall').checked = false;\n      wlSelectedPM = null;\n      refreshWorkloadTab();\n    });\n    document.getElementById('ganttRows').addEventListener('click', (e) => {\n      const row = e.target.closest('.gantt-row[data-id]');\n      if (row) openDetail(row.dataset.id);\n    });\n\n    refreshWorkloadTab();\n  }\n\n  \u002F\u002F ---------- Masterplan tab ----------\n  \u002F\u002F Day-level capacity plan: reuses the same per-project remaining-hours\n  \u002F\u002F spread as the PM Workload tab above, but stacks it by calendar day\n  \u002F\u002F (not week) per PM, so overlapping projects show up as a visible spike\n  \u002F\u002F instead of being smoothed out into a weekly total.\n  let masterplanRendered = false;\n  let mpSelectedPM = null;\n  const MP_WINDOW_DAYS = 371; \u002F\u002F ~53 weeks, so the grid always ends on a week boundary\n  const MP_DAY_PX = 4;\n\n  function dayLoadColorClass(hours){\n    if (hours <= 0.25) return 'mp-d0';\n    if (hours <= 6) return 'mp-d1';\n    if (hours <= 8) return 'mp-d2';\n    return 'mp-d3';\n  }\n\n  function buildMasterplanDays(){\n    const start = weekStart(TODAY);\n    const days = [];\n    for (let i=0;i<MP_WINDOW_DAYS;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); }\n    return days;\n  }\n\n  function buildMasterplanItems(showAllTypes){\n    let base = ROWS.filter(r => !r.onhold && !r.released);\n    if (!showAllTypes) base = base.filter(isPO);\n    const out = [];\n    base.forEach(r => {\n      const ship = parseYMD(r.ship) || parseYMD(r.planEnd);\n      if (!ship) return;\n      const kickoff = parseYMD(r.kickoff);\n      const remaining = Math.max((r.voorcalc||0) - (r.geboekt||0), 0);\n      if (remaining <= 0) return;\n      const spreadStart = (kickoff && kickoff > TODAY) ? kickoff : TODAY;\n      const spreadEnd = ship > spreadStart ? ship : new Date(spreadStart.getTime() + 86400000);\n      const totalDays = Math.max(daysBetween(spreadEnd, spreadStart), 1);\n      out.push({ r, spreadStart, spreadEnd, perDay: remaining\u002FtotalDays });\n    });\n    return out;\n  }\n\n  \u002F\u002F Collapses a PM's per-day hours into contiguous runs of the same color\n  \u002F\u002F band, so each row is a handful of positioned <div>s instead of hundreds.\n  function renderDayStrip(dailyHours, days){\n    let html = '';\n    let i = 0;\n    while (i < days.length){\n      const cls = dayLoadColorClass(dailyHours[i]);\n      let j = i+1;\n      while (j < days.length && dayLoadColorClass(dailyHours[j]) === cls) j++;\n      if (cls !== 'mp-d0'){\n        html += `<div class=\"mp-cell ${cls}\" style=\"left:${i*MP_DAY_PX}px; width:${(j-i)*MP_DAY_PX}px;\" title=\"${Math.round(dailyHours[i]*10)\u002F10}h that day\"><\u002Fdiv>`;\n      }\n      i = j;\n    }\n    return html;\n  }\n\n  function refreshMasterplanTab(){\n    const showAllTypes = document.getElementById('mp-f-showall').checked;\n    const items = buildMasterplanItems(showAllTypes);\n\n    \u002F\u002F PM options come from `items` (already scoped by \"show all types\" and\n    \u002F\u002F excluding on-hold\u002Freleased\u002Fzero-remaining rows), not the full ROWS\n    \u002F\u002F set, so a PM with nothing currently in scope drops out of the list.\n    \u002F\u002F Resolved before `scoped` below so a PM that just fell out of scope\n    \u002F\u002F doesn't filter the render down to zero rows for this pass.\n    const mpAvailablePMs = [...new Set(items.map(it => it.r.pm).filter(Boolean))].sort();\n    const mpPmSel = document.getElementById('mp-f-pm');\n    const requestedPM = mpPmSel.value;\n    const pmFilter = (requestedPM && mpAvailablePMs.includes(requestedPM)) ? requestedPM : '';\n    mpPmSel.innerHTML = '<option value=\"\">All PMs<\u002Foption>';\n    fillSelect('mp-f-pm', mpAvailablePMs);\n    mpPmSel.value = pmFilter;\n\n    const scoped = pmFilter ? items.filter(p => p.r.pm === pmFilter) : items;\n\n    const days = buildMasterplanDays();\n    const byPM = {};\n    scoped.forEach(({r, spreadStart, spreadEnd, perDay}) => {\n      const arr = byPM[r.pm] || (byPM[r.pm] = new Array(days.length).fill(0));\n      days.forEach((d,i) => { if (d >= spreadStart && d < spreadEnd) arr[i] += perDay; });\n    });\n    const pmList = Object.keys(byPM).sort((a,b) => byPM[b].reduce((s,v)=>s+v,0) - byPM[a].reduce((s,v)=>s+v,0));\n\n    const scopeText = showAllTypes ? 'across all active projects' : 'for P\u002FO-numbered active projects';\n    const projCount = new Set(scoped.map(p=>p.r.id)).size;\n    document.getElementById('mpSummaryLine').textContent =\n      `${fmtInt(projCount)} active projects with hours still remaining ${scopeText}${pmFilter ? ' — showing ' + pmFilter : ''}.`;\n\n    const totalPx = days.length * MP_DAY_PX;\n    const todayOffset = Math.max(daysBetween(TODAY, days[0]), 0) * MP_DAY_PX;\n\n    const months = [];\n    let cursor = new Date(days[0].getFullYear(), days[0].getMonth(), 1);\n    if (cursor < days[0]) cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    const lastDay = days[days.length-1];\n    while (cursor <= lastDay){\n      months.push({ d: cursor, left: Math.max(daysBetween(cursor, days[0]), 0) * MP_DAY_PX });\n      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);\n    }\n    document.getElementById('mpMonths').innerHTML =\n      `<div style=\"position:relative; width:${totalPx}px; height:18px;\">` +\n      months.map(m => `<span style=\"left:${m.left}px;\">${MONTH_ABBR[m.d.getMonth()]} ${String(m.d.getFullYear()).slice(2)}<\u002Fspan>`).join('') +\n      `<div class=\"mp-today\" style=\"left:${todayOffset}px;\"><\u002Fdiv>` +\n      `<\u002Fdiv>`;\n\n    if (pmList.length === 0){\n      document.getElementById('mpRows').innerHTML = `<p style=\"color:var(--ink-muted); font-size:12.5px; padding:12px 2px;\">No active projects with remaining hours in scope right now.<\u002Fp>`;\n      document.getElementById('mpTotalRow').innerHTML = '';\n      return;\n    }\n\n    document.getElementById('mpRows').innerHTML = pmList.map(pm => {\n      const arr = byPM[pm];\n      const total = Math.round(arr.reduce((s,v)=>s+v,0));\n      return `<div class=\"mp-row${mpSelectedPM===pm?' mp-selected':''}\" data-pm=\"${escapeAttr(pm)}\">\n        <div class=\"mp-pmname\" title=\"${escapeAttr(pm)}\">${escapeHtml(pm)}<\u002Fdiv>\n        <div class=\"mp-pmtotal\">${fmtInt(total)}h<\u002Fdiv>\n        <div class=\"mp-strip\" style=\"width:${totalPx}px;\">${renderDayStrip(arr, days)}<div class=\"mp-today\" style=\"left:${todayOffset}px;\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join('');\n\n    const totals = new Array(days.length).fill(0);\n    pmList.forEach(pm => byPM[pm].forEach((v,i) => totals[i]+=v));\n    const grandTotal = Math.round(totals.reduce((s,v)=>s+v,0));\n    document.getElementById('mpTotalRow').innerHTML =\n      `<div class=\"mp-pmname\">All PMs<\u002Fdiv>\n       <div class=\"mp-pmtotal\">${fmtInt(grandTotal)}h<\u002Fdiv>\n       <div class=\"mp-strip\" style=\"width:${totalPx}px;\">${renderDayStrip(totals, days)}<div class=\"mp-today\" style=\"left:${todayOffset}px;\"><\u002Fdiv><\u002Fdiv>`;\n  }\n\n  function renderMasterplanTab(){\n    if (masterplanRendered) return;\n    masterplanRendered = true;\n\n    document.getElementById('mpRows').addEventListener('click', (e) => {\n      const row = e.target.closest('.mp-row[data-pm]');\n      if (!row) return;\n      const pm = row.dataset.pm;\n      mpSelectedPM = (mpSelectedPM === pm) ? null : pm;\n      document.getElementById('mp-f-pm').value = mpSelectedPM || '';\n      refreshMasterplanTab();\n    });\n    document.getElementById('mp-f-pm').addEventListener('change', () => {\n      mpSelectedPM = document.getElementById('mp-f-pm').value || null;\n      refreshMasterplanTab();\n    });\n    document.getElementById('mp-f-showall').addEventListener('change', refreshMasterplanTab);\n    document.getElementById('mpResetChip').addEventListener('click', () => {\n      document.getElementById('mp-f-pm').value = '';\n      document.getElementById('mp-f-showall').checked = false;\n      mpSelectedPM = null;\n      refreshMasterplanTab();\n    });\n\n    refreshMasterplanTab();\n  }\n\n  \u002F\u002F ---------- Kiosk \u002F TV mode ----------\n  \u002F\u002F Add ?tv=1 (or ?kiosk=1) to this artifact's URL on the screen that has\n  \u002F\u002F no keyboard, mouse or remote. It then cycles through every tab on a\n  \u002F\u002F fixed timer, and for any tab whose table\u002Fchart\u002Fgantt is taller or\n  \u002F\u002F wider than the screen, slowly auto-scrolls it from start to end during\n  \u002F\u002F its turn — so nothing on that tab ever needs a manual scroll or click.\n  \u002F\u002F Normal interactive use (this same link without the parameter) is\n  \u002F\u002F completely unaffected.\n  (function initKioskMode(){\n    const params = new URLSearchParams(location.search);\n    if (!params.has('tv') && !params.has('kiosk')) return;\n\n    const SEQUENCE = ['dashboard', 'charts', 'milestones']; \u002F\u002F 'workload' and 'masterplan' skipped in TV mode\n    const MIN_INTERVAL_MS = 30000;   \u002F\u002F floor dwell time, even for a tab with nothing to scroll\n    const SCROLL_PAUSE_MS = 1000;    \u002F\u002F dead stop at the top\u002Fbottom of a scroll before moving on\n    \u002F\u002F How fast the auto-scroll travels. Chosen so a project row (~51px\n    \u002F\u002F tall) advances roughly once a second — slow enough to actually read\n    \u002F\u002F a line before the next one arrives, rather than a fixed-duration\n    \u002F\u002F scroll that raced through 140+ rows in under 30 seconds.\n    const READ_PX_PER_SEC = 26;\n    const SCROLL_SELECTOR = {\n      dashboard: '.table-container',\n      milestones: '.gantt-wrap-scroll', \u002F\u002F the Timeline is now the only (and the scrollable) view on this tab\n      charts: '#pmChart',\n      workload: '.workload-scroll',\n      masterplan: '.mp-scroll'\n    };\n\n    document.body.classList.add('kiosk-mode');\n    const bar = document.createElement('div');\n    bar.id = 'kiosk-progress';\n    document.body.appendChild(bar);\n\n    \u002F\u002F A constant crawl rather than an ease-in-out curve: with the whole\n    \u002F\u002F motion lasting 1-2+ minutes, the old quadratic easing spent its\n    \u002F\u002F first and last quarters visibly speeding up\u002Fslowing down, so a line\n    \u002F\u002F near the top or bottom drifted past at a different pace than one in\n    \u002F\u002F the middle. Linear motion reads at the same speed start to finish;\n    \u002F\u002F the 1-second dead stop before and after (SCROLL_PAUSE_MS) is what\n    \u002F\u002F gives the top and bottom rows their own beat to be read.\n    function animateScroll(el, prop, to, duration){\n      const from = el[prop];\n      const start = performance.now();\n      const token = start;\n      el.dataset.kioskRun = String(token);\n      function step(now){\n        if (el.dataset.kioskRun !== String(token)) return; \u002F\u002F superseded by a newer tab switch\n        const t = Math.min(1, (now - start) \u002F duration);\n        el[prop] = from + (to - from) * t;\n        if (t < 1) requestAnimationFrame(step);\n      }\n      requestAnimationFrame(step);\n    }\n\n    \u002F\u002F Finds this tab's scrollable element (if any) and how far it has to\n    \u002F\u002F travel, so the dwell time can be sized to the actual content — a\n    \u002F\u002F short list and a 146-row table shouldn't get the same fixed timer.\n    function measureOverflow(name){\n      const sel = SCROLL_SELECTOR[name];\n      const el = sel ? document.querySelector('#' + name + '-tab ' + sel) : null;\n      if (!el) return { el: null, overflow: 0 };\n      const vOverflow = el.scrollHeight - el.clientHeight;\n      const hOverflow = el.scrollWidth - el.clientWidth;\n      return { el, overflow: Math.max(vOverflow, hOverflow, 0) };\n    }\n\n    function runTab(name){\n      switchTab(name);\n\n      \u002F\u002F Give the tab's own render function a frame to paint before measuring it.\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        const { el, overflow } = measureOverflow(name);\n        const duration = overflow > 4\n          ? Math.max(MIN_INTERVAL_MS, Math.round(overflow \u002F READ_PX_PER_SEC * 1000) + 2 * SCROLL_PAUSE_MS)\n          : MIN_INTERVAL_MS;\n\n        bar.style.transition = 'none';\n        bar.style.width = '0%';\n        void bar.offsetWidth; \u002F\u002F force reflow so the transition below restarts\n        bar.style.transition = `width ${duration}ms linear`;\n        bar.style.width = '100%';\n\n        if (el && overflow > 4){\n          el.scrollTop = 0;\n          el.scrollLeft = 0;\n          const vOverflow = el.scrollHeight - el.clientHeight;\n          const hOverflow = el.scrollWidth - el.clientWidth;\n          const scrollWindow = Math.max(duration - 2 * SCROLL_PAUSE_MS, 2000);\n          if (vOverflow > 4) {\n            setTimeout(() => animateScroll(el, 'scrollTop', vOverflow, scrollWindow), SCROLL_PAUSE_MS);\n          } else if (hOverflow > 4) {\n            setTimeout(() => animateScroll(el, 'scrollLeft', hOverflow, scrollWindow), SCROLL_PAUSE_MS);\n          }\n        }\n\n        setTimeout(tick, duration);\n      }));\n    }\n\n    let idx = 0;\n    function tick(){\n      const name = SEQUENCE[idx];\n      idx = (idx + 1) % SEQUENCE.length;\n      runTab(name);\n    }\n    tick();\n  })();\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"</script>
