  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

}\n\u002F* latin *\u002F\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"4aa79e84-7631-4236-b2a8-34656980e21f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  @font-face{font-family:\"Proxima Nova\";src:url(\"28948001-b30d-4dd8-8f76-c7aec83137cb\") format(\"truetype\");font-weight:400;font-display:swap;}\n  @font-face{font-family:\"Proxima Nova\";src:url(\"c729b745-d35e-4d6b-98ff-f0e8b450eb6c\") format(\"truetype\");font-weight:600;font-display:swap;}\n  @font-face{font-family:\"Proxima Nova\";src:url(\"593212f6-c126-400b-8aa7-86f77e69602f\") format(\"truetype\");font-weight:800;font-display:swap;}\n  :root{\n    color-scheme: dark;\n    --page:#0e0e0d; --surface:#1d1d1b; --surface-2:#262624;\n    --ink:#ffffff; --ink-2:#d1d1cc; --ink-muted:#8d8d88;\n    --hair:#3a3a37; --border:#3a3a37;\n    --dark-1:#0e0e0d; --dark-2:#1d1d1b; --dark-3:#262624;\n    --gold:#6ab12e; --gold-hover:#6ab12e; --gold-ink:#0e0e0d;\n    --good:#6ab12e; --warning:#e0a300; --serious:#ec835a; --critical:#e30613; --info:#4a90e2;\n    --good-wash:rgba(106,177,46,.16); --warning-wash:rgba(224,163,0,.16); --serious-wash:rgba(236,131,90,.16); --critical-wash:rgba(227,6,19,.20); --hold-wash:rgba(255,255,255,.06); --hold:#d1d1cc;\n    --shadow: 0 1px 0 rgba(0,0,0,.4);\n    --radius: 4px;\n  }\n  *{box-sizing:border-box;}\n  body{\n    margin:0; background:var(--page); color:var(--ink);\n    font-family:\"Nunito Sans\",\"Proxima Nova\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    -webkit-font-smoothing:antialiased;\n  }\n  .mono{ font-family:\"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace; }\n  .tab-nums{ font-variant-numeric: tabular-nums; }\n  a{ color:var(--gold); text-decoration:none; border-bottom:1px solid transparent; }\n  a:hover{ border-bottom-color:var(--gold); }\n  :focus-visible{ outline:2px solid var(--gold-hover); outline-offset:1px; }\n\n  \u002F* ---------- header ---------- *\u002F\n  header.top{\n    background:var(--dark-2); border-bottom:1px solid var(--hair);\n    color:#fff; padding:10px 28px 0;\n  }\n  header.top .row{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; padding-bottom:8px; }\n  header.top h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px;}\n  header.top h1 .accent{ color:var(--gold-hover); }\n  header.top p{ margin:4px 0 0; color:#d1d1cc; font-size:12.5px; max-width:60ch; }\n  header.top .meta{ text-align:right; font-size:11.5px; color:#8d8d88; line-height:1.7; }\n  header.top .meta strong{ color:#ffffff; font-weight:600; }\n\n  .tabs{ display:flex; gap:2px; padding:0 24px; }\n  .tabbtn{\n    appearance:none; border:none; cursor:pointer; padding:6px 18px; font-size:13px; font-weight:600;\n    background:var(--dark-3); color:#8d8d88; border-radius:2px 2px 0 0; font-family:inherit;\n  }\n  .tabbtn.active{ background:var(--gold-hover); color:var(--gold-ink); }\n  .tabbtn:not(.active):hover{ background:#2f2f2c; color:#ffffff; }\n\n  .wrap{ max-width:1700px; margin:0 auto; padding:14px 24px 16px; }\n  [hidden]{ display:none !important; }\n\n  \u002F* ---------- KPI tiles ---------- *\u002F\n  .kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:10px; }\n  @media (max-width:1000px){ .kpis{ grid-template-columns:repeat(2,1fr);} }\n  .tile{\n    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);\n    padding:9px 14px; box-shadow:var(--shadow);\n  }\n  .tile .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); font-weight:600; }\n  .tile .value{ font-size:26px; font-weight:700; line-height:1.15; margin-top:2px; }\n  .tile .sub{ font-size:12px; color:var(--ink-2); margin-top:2px; }\n  .tile.warn .value{ color:var(--critical); }\n  .tile.clickable{ appearance:none; -webkit-appearance:none; display:block; margin:0; cursor:pointer; text-align:left; font-family:inherit; width:100%; transition:box-shadow .15s, border-color .15s, background .15s; }\n  .tile.clickable:hover{ border-color:var(--gold); box-shadow:0 6px 18px rgba(0,0,0,.45); }\n  .tile.clickable.active{ border-color:var(--gold); background:rgba(106,177,46,.12); box-shadow:0 0 0 2px var(--gold-hover) inset, var(--shadow); }\n  .tile-hint{ font-size:10.5px; font-weight:600; margin-top:6px; color:var(--ink-muted); opacity:0; }\n  .tile.clickable:hover .tile-hint{ opacity:1; }\n  .tile.clickable.active .tile-hint{ opacity:1; color:var(--gold); }\n  \u002F* Workload, Masterplan and Overall charts don't read the KPI quick\n     filter at all, so a tile click there would look like it did something\n     (highlighting, hint text) while the page underneath stays identical.\n     Disabling them here avoids that dead-end interaction. *\u002F\n  #kpis.kpis-inert .tile.clickable{ cursor:default; opacity:0.6; }\n  #kpis.kpis-inert .tile.clickable:hover{ border-color:var(--hair); box-shadow:none; }\n  #kpis.kpis-inert .tile-hint{ opacity:1; }\n\n  \u002F* ---------- filter bar ---------- *\u002F\n  .filterbar{\n    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;\n    padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);\n  }\n  .filterbar select, .filterbar input[type=search]{\n    font-family:inherit; font-size:12.5px; padding:7px 9px; border-radius:3px; border:1px solid var(--hair);\n    background:var(--surface-2); color:var(--ink);\n  }\n  .filterbar input[type=search]{ flex:1; min-width:160px; }\n  .filterbar select{ max-width:180px; }\n  .chip{\n    font-size:12px; padding:6px 11px; border-radius:999px; border:1px solid var(--hair);\n    background:var(--surface-2); color:var(--ink-2); cursor:pointer; user-select:none;\n    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;\n  }\n  .chip .dot{ width:7px; height:7px; border-radius:50%; }\n  .chip[aria-pressed=\"true\"]{ background:rgba(106,177,46,.18); border-color:var(--gold); color:var(--ink); font-weight:600; }\n  .chip.reset{ color:var(--ink-muted); }\n  .chip.checkbox-chip{ gap:7px; }\n  .chip.checkbox-chip input[type=checkbox]{ margin:0; accent-color:var(--gold); width:13px; height:13px; }\n  .chip.checkbox-chip:has(input:checked){ background:rgba(106,177,46,.18); border-color:var(--gold); color:var(--ink); font-weight:600; }\n  .result-count{ font-size:12px; color:var(--ink-muted); margin-left:auto; white-space:nowrap; }\n\n  \u002F* ---------- table ---------- *\u002F\n  .table-container{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; max-height:788px; }\n  table.tracker{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:1340px; }\n  table.tracker thead th{\n    position:sticky; top:0; z-index:2; background:var(--dark-1); color:#d1d1cc;\n    text-align:left; padding:10px 12px; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.03em;\n    cursor:pointer; white-space:nowrap; border-bottom:2px solid var(--gold-hover);\n  }\n  table.tracker thead th:hover{ color:#fff; }\n  table.tracker thead th .arrow{ opacity:0.5; margin-left:4px; font-size:10px; }\n  table.tracker tbody td{ padding:5px 12px; border-bottom:1px solid var(--hair); vertical-align:middle; color:var(--ink-2); }\n  \u002F* PM is the first column on both the Dashboard and Milestones tables; the\n     longer full names (e.g. \"Muhammad Alif Haikal bin Zukeri\") were wrapping\n     onto 2-3 lines because auto table layout squeezed this column down to\n     ~90px. Force enough width to fit any real name on one line. *\u002F\n er; gap:5px; }\n  .legend-row .sw .box{ width:9px; height:9px; border-radius:2px; }\n\n  footer.notes{\n    margin-top:26px; padding-top:16px; border-top:1px solid var(--hair);\n    font-size:12.5px; color:var(--ink-2); line-height:1.7; max-width:92ch;\n  }\n  footer.notes h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin:0 0 8px; }\n  footer.notes p{ margin:0 0 10px; }\n  footer.notes code{ font-family:\"JetBrains Mono\",monospace; background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:11.5px; }\n\n  .empty-state{ text-align:center; padding:36px 20px; color:var(--ink-muted); font-size:13px; }\n\n  \u002F* ---------- row click \u002F modal ---------- *\u002F\n  table.tracker tbody tr{ cursor:pointer; }\n  table.tracker tbody tr:hover .nr{ text-decoration:underline; text-decoration-color:var(--gold); }\n\n  .modal-overlay{\n    position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:50;\n    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;\n    overflow-y:auto;\n  }\n  .modal{\n    background:var(--surface); border-radius:4px; box-shadow:0 24px 60px rgba(0,0,0,0.55);\n    width:100%; max-width:960px; margin-bottom:5vh; overflow:hidden;\n  }\n  .modal.wide{ max-width:1320px; }\n\n  \u002F* ---------- Set-Up: activity schedule + materials ---------- *\u002F\n  .setup-info-row{ display:flex; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin:-6px 0 16px; }\n  .setup-info-row .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }\n  .setup-info-row .dot.green{ background:var(--good); }\n  .setup-info-row .dot.grey{ background:var(--ink-muted); }\n  .setup-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:6px; }\n  @media (max-width:980px){ .setup-grid{ grid-template-columns:1fr; } }\n  .setup-pane{ background:var(--surface-2); border:1px solid var(--hair); bord rface); color:var(--ink); font-weight:700; }\n  tr.mat-additional td{ color:var(--ink-muted); font-style:italic; }\n  .setup-note{ font-size:11px; color:var(--ink-muted); margin:10px 2px 2px; }\n  .modal-head{\n    background:var(--dark-2); color:#fff; border-bottom:1px solid var(--hair);\n    padding:18px 22px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px;\n  }\n  .modal-head .htitle-group{ display:flex; align-items:flex-start; gap:10px; min-width:0; }\n  .modal-head .htitle{ font-size:16px; font-weight:700; }\n  .modal-head .hsub{ font-size:12px; color:#d1d1cc; margin-top:3px; }\n  .modal-head .hclose, .modal-head .hback{\n    appearance:none; border:none; background:rgba(255,255,255,0.10); color:#fff; height:28px;\n    border-radius:4px; cursor:pointer; font-size:15px; line-height:1; flex:0 0 auto;\n  }\n  .modal-head .hclose{ width:28px; }\n  \u002F* A plain \"‹\" chevron reads as decoration more than an action, so this\n     spells out \"Back\" too — it's the only way back to the PM projects\n     popup once you've opened a project's full detail from there. *\u002F\n  .modal-head .hback{ width:auto; display:inline-flex; align-items:center; gap:4px; padding:0 10px 0 8px; font-size:13px; font-weight:600; margin-top:1px; }\n  .modal-head .hback .hback-arrow{ font-size:18px; font-weight:700; line-height:1; }\n  .modal-head .hclose:hover, .modal-head .hback:hover{ background:rgba(255,255,255,0.22); }\n  .modal-body{ padding:20px 22px 24px; max-height:78vh; overflow-y:auto; }\n\n  .detail-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }\n  @media (max-width:720px){ .detail-grid{ grid-template-columns:repeat(2,1fr); } }\n  .detail-field .dlabel{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); font-weight:600; }\n  .detail-field .dvalue{ font-size:13px; color:var(--ink); margin-top:2px; font-weight:600; }\n  .detail-field .dvalue.mono{ font-family:\"JetBrains Mono\",monospace; font-weight:500; }\n\n  .modal-section-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); font-weight:700; margin:18px 0 8px; }\n  .modal-section-title:first-of-type{ margin-top:0; }\n\n  \u002F* ---------- risk flag chips ---------- *\u002F\n  .flags-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }\n  .flag-chip{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }\n  .flag-chip.flag-critical{ background:var(--critical-wash); color:#ff8086; }\n  .flag-chip.flag-warning{ background:var(--warning-wash); color:#e8bf5e; }\n  .flag-chip.flag-hold{ background:var(--hold-wash); color:var(--hold); }\n\n  \u002F* ---------- customer context line ---------- *\u002F\n  .cust-context{ font-size:12px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--hair); border-radius:4px; padding:8px 12px; margin:-6px 0 18px; }\n  .cust-context strong{ color:var(--ink); }\n\n  \u002F* ---------- timeline visual ---------- *\u002F\n  .timeline-track{ position:relative; height:8px; border-radius:4px; background:#3a3a37; margin:14px 4px 8px; }\n  .timeline-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--gold-hover); }\n  .timeline-fill.overdue{ background:var(--critical); }\n  .timeline-marker{ position:absolute; top:50%; width:11px; height:11px; border-radius:50%; transform:translate(-50%,-50%); border:2px solid #0e0e0d; box-shadow:0 0 0 1px rgba(0,0,0,0.6); cursor:default; }\n  .timeline-marker.mk-kickoff{ background:var(--ink-2); }\n  .timeline-marker.mk-ship{ background:var(--gold); }\n  .timeline-marker.mk-planend{ background:var(--hold); }\n  .timeline-marker.mk-released{ background:var(--good); }\n  .timeline-today{ position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--gold); }\n  .timeline-today .tt-label{ position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:9.5px; font-weight:600; color:var(--ink); white-space:nowrap; }\n  .timeline-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin:6px 0 18px; }\n  .timeline-legend .sw{ display:inline-flex; align-items:center; gap:5px; }\n  .timeline-legend .sw .box{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }\n\n  \u002F* ---------- financials section ---------- *\u002F\n  .fin-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:12px; }\n  @media (max-width:820px){ .fin-grid{ grid-template-columns:repeat(2,1fr); } }\n  .fin-tile{ background:var(--surface-2); border:1px solid var(--hair); border-radius:4px; padding:10px 12px; }\n  .fin-tile .label{ font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); font-weight:600; }\n  .fin-tile .value{ font-size:15px; font-weight:700; color:var(--ink); margin-top:3px; line-height:1.2; }\n  .fin-tile .sub{ font-size:10px; color:var(--ink-muted); margin-top:3px; }\n  .fin-tile.warn .value{ color:var(--critical); }\n  .fin-progress-track{ position:relative; height:8px; border-radius:4px; background:#3a3a37; overflow:hidden; }\n  .fin-progress-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--good); }\n  .fin-progress-fill.over{ background:var(--warning); }\n  .fin-progress-label{ font-size:11px; color:var(--ink-2); margin-top:6px; }\n\n  table.inv-table{ width:100%; border-collapse:collapse; font-size:12px; }\n  table.inv-table th{ text-align:left; padding:6px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); border-bottom:1px solid var(--hair); font-weight:600; }\n  table.inv-table td{ padding:7px 10px; border-bottom:1px solid var(--hair); color:var(--ink-2); vertical-align:middle; }\n  table.inv-table tr:last-child td{ border-bottom:none; }\n  table.inv-table td.num{ text-align:right; font-family:\"JetBrains Mono\",monospace; }\n  table.inv-table td.terms{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-muted); font-size:11.5px; }\n\n  .paid-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; white-space:nowrap; }\n  .paid-pill .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }\n  .paid-yes{ background:var(--good-wash); color:#8fd44f; } .paid-yes .dot{ background:var(--good); }\n  .paid-no{ background:var(--critical-wash); color:#ff8086; } .paid-no .dot{ background:var(--critical); }\n  .paid-no.aging-ok{ background:var(--good-wash); color:#8fd44f; } .paid-no.aging-ok .dot{ background:var(--good); }\n  .terms-pill{ font-size:10.5px; color:var(--ink-muted); white-space:nowrap; }\n\n  .no-invoices{ font-size:12.5px; color:var(--ink-muted); padding:10px 2px; }\n  .inv-summary{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--ink-2); }\n  .inv-summary strong{ color:var(--ink); }\n\n  \u002F* ---------- aging summary table (Unpaid Invoices tab) ---------- *\u002F\n  table.aging-table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:520px; }\n  table.aging-table th{ text-align:left; padding:8px 12px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); border-bottom:2px solid var(--hair); font-weight:600; }\n  table.aging-table th.num, table.aging-table td.num{ text-align:right; font-family:\"JetBrains Mono\",monospace; }\n  table.aging-table td{ padding:9px 12px; border-bottom:1px solid var(--hair); color:var(--ink-2); }\n  table.aging-table tbody tr{ cursor:pointer; }\n  table.aging-table tbody tr:hover{ background:#262624; }\n  table.aging-table tbody tr.active-bucket{ background:rgba(106,177,46,.18); }\n  table.aging-table tbody tr.active-bucket td{ font-weight:600; color:var(--ink); }\n  table.aging-table tbody tr.bucket-90plus td.bucket-label{ color:#ff8086; font-weight:700; }\n  table.aging-table tbody tr.bucket-60-90 td.bucket-label{ color:#f0a279; font-weight:600; }\n  table.aging-table tbody tr.bucket-notdue td.bucket-label{ color:#8fd44f; font-weight:600; }\n  table.aging-table tfoot tr{ font-weight:700; color:var(--ink); border-top:2px solid var(--hair); }\n  table.aging-table tfoot td{ padding:9px 12px; border-bottom:none; }\n  .bucket-hint{ font-size:10px; font-weight:600; color:var(--ink-muted); }\n  table.aging-table tbody tr.active-bucket .bucket-hint{ color:var(--gold); }\n\n  \u002F* ---------- PM Workload tab ---------- *\u002F\n  .workload-scroll{ overflow-x:auto; }\n  table.workload-table{ width:100%; border-collapse:collapse; font-size:12px; min-width:760px; }\n  table.workload-table th{ text-align:right; padding:7px 9px; font-size:10px; text-transform:uppercase; letter-spacing:0.02em; color:var(--ink-muted); border-bottom:2px solid var(--hair); font-weight:600; white-space:nowrap; }\n  table.workload-table th:first-child, table.workload-table td:first-child{ text-align:left; position:sticky; left:0; background:var(--surface); }\n  table.workload-table td{ padding:7px 9px; border-bottom:1px solid var(--hair); text-align:right; font-family:\"JetBrains Mono\",monospace; tab-size:4; }\n  table.workload-table tbody tr{ cursor:pointer; }\n  table.workload-table tbody tr:hover td:first-child{ text-decoration:underline; text-decoration-color:var(--gold); }\n  table.workload-table tbody tr.pm-selected td:first-child{ font-weight:700; color:var(--ink); }\n  table.workload-table td.pm-name{ font-family:\"Nunito Sans\",\"Proxima Nova\",sans-serif; color:var(--ink); font-weight:600; white-space:nowrap; }\n  table.workload-table td.load-cell{ border-radius:3px; }\n  table.workload-table tfoot td{ font-weight:700; color:var(--ink); border-top:2px solid var(--hair); border-bottom:none; font-family:\"JetBrains Mono\",monospace; }\n  table.workload-table tfoot td.pm-name{ font-family:\"Nunito Sans\",\"Proxima Nova\",sans-serif; }\n  .load-0{ color:#5a5a55; }\n  .load-low{ background:var(--good-wash); color:#8fd44f; }\n  .load-mid{ background:var(--warning-wash); color:#e8bf5e; }\n  .load-high{ background:var(--critical-wash); color:#ff8086; font-weight:700; }\n  .workload-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin:10px 0 0; }\n  .workload-legend .sw{ display:inline-flex; align-items:center; gap:5px; }\n  .workload-legend .sw .box{ width:9px; height:9px; border-radius:3px; }\n\n  .gantt-wrap{ position:relative; }\n  \u002F* Full-tab Gantt panels (Milestones' Timeline, Workload's Schedule) grow\n     with the row count — with 100+ projects that made the whole page\n     balloon to several screens tall, on top of the table below also\n     scrolling internally. Capping and scrolling this region the same way\n     .table-container does keeps every tab's overall page height (and\n     scroll behavior) the same as the Dashboard's. *\u002F\n  .gantt-wrap-scroll{ max-height:720px; overflow-y:auto; overflow-x:hidden; }\n  .gantt-wrap-scroll .gantt-months{ position:sticky; top:0; z-index:2; background:var(--surface); }\n  .gantt-months{ position:relative; height:18px; margin-bottom:4px; font-size:10px; color:var(--ink-muted); }\n  .gantt-months span{ position:absolute; top:0; border-left:1px solid var(--hair); padding-left:4px; white-space:nowrap; }\n  .gantt-rows{ position:relative; }\n  .gantt-today-line{ position:absolute; top:0; bottom:0; width:2px; background:var(--gold); z-index:2; pointer-events:none; }\n  .gantt-today-line .tt-label{ position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:9.5px; font-weight:600; color:var(--ink); white-space:nowrap; }\n  .gantt-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--hair); }\n  .gantt-row:last-child{ border-bottom:none; }\n  .gantt-label{ width:230px; flex:0 0 auto; overflow:hidden; }\n  .gantt-label .nr{ font-family:\"JetBrains Mono\",monospace; font-weight:600; color:var(--ink); font-size:12px; }\n  .gantt-label .desc{ display:block; color:var(--ink-muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n  \u002F* Milestones tab: project number, description and PM all on one line\n     instead of the two-line label above, so the timeline reads as one\n     compact row per project with no separate PM group headers. *\u002F\n  .gantt-label.ms-label{ width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n  .gantt-label.ms-label .nr, .gantt-label.pm-proj-label .nr{ margin-right:8px; }\n  .desc-inline{ color:var(--ink-2); font-size:11px; margin-right:8px; }\n  .pm-inline{ color:var(--ink-muted); font-size:10.5px; }\n  .pm-inline::before{ content:\"· \"; }\n  \u002F* PM projects popup (from the \"Active projects by PM\" chart): same\n     single-line idea as the Milestones tab, minus the PM segment since the\n     popup's own header already names the PM. *\u002F\n  .gantt-label.pm-proj-label{ width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n  \u002F* Status-code badge shown per line in the PM projects popup (Overall\n     charts tab) — reuses the same colour classes as the Dashboard's status\n     pill (status-good\u002Fwarning\u002Fhold\u002Fneutral) so a \"52\" or \"60\" here means\n     the same thing it does everywhere else in the app. *\u002F\n  .gantt-status-num{ width:36px; flex:0 0 auto; text-align:center; font-family:\"JetBrains Mono\",monospace; font-size:11px; font-weight:700; border-radius:4px; padding:3px 0; color:var(--ink-2); }\n  .gantt-track{ position:relative; flex:1; height:16px; background:#3a3a37; border-radius:4px; }\n  .gantt-bar{ position:absolute; top:2px; height:12px; border-radius:4px; background:var(--gold-hover); min-width:3px; }\n  .gantt-bar.hold{ background:var(--hold); }\n  .gantt-bar.overdue{ background:var(--critical); }\n  .gantt-bar.ontrack{ background:var(--good); }\n  .gantt-bar.done{ background:var(--ink-muted); }\n  \u002F* When a project's Planned end has been pushed out past its (older) Ship\n     date, the bar is split in two: the normal status colour up to the ship\n     date, then this blue segment for the extra time added on top of it. *\u002F\n  .gantt-bar.extended{ background:var(--info); }\n  .gantt-bar.seg-left{ border-top-right-radius:0; border-bottom-right-radius:0; }\n  .gantt-bar.seg-right{ border-top-left-radius:0; border-bottom-left-radius:0; }\n  \u002F* The reverse case: Planned end falls BEFORE the Ship date (the usual\n     situation, since Ship is normally the later, firmer commitment). There's\n     no extra span to show there, just an earlier internal target sitting\n     inside the ship-based bar, so it gets a small tick rather than a second\n     segment. Purely informational — shown regardless of on-time\u002Foverdue. *\u002F\n  .gantt-plan-tick{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--hold); border-radius:1px; cursor:default; z-index:1; }\n  .gantt-hours{ width:92px; flex:0 0 auto; text-align:right; font-family:\"JetBrains Mono\",monospace; font-size:11px; color:var(--ink-2); }\n  .gantt-pm-group{ font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); font-weight:700; padding:12px 0 4px; }\n  .gantt-pm-group:first-child{ padding-top:0; }\n\n  \u002F* ---------- Masterplan tab ---------- *\u002F\n  .mp-scroll{ overflow-x:auto; padding-bottom:4px; }\n  .mp-grid{ position:relative; }\n  .mp-months{ position:relative; height:18px; margin:0 0 4px 225px; font-size:10px; color:var(--ink-muted); }\n  .mp-months span{ position:absolute; top:0; border-left:1px solid var(--hair); padding-left:4px; white-space:nowrap; }\n  .mp-day-w{ --mp-daypx: 4px; }\n  .mp-row{ display:flex; align-items:center; height:22px; border-bottom:1px solid var(--hair); cursor:pointer; }\n  .mp-row:last-child{ border-bottom:none; }\n  .mp-row:hover .mp-pmname{ text-decoration:underline; text-decoration-color:var(--gold); }\n  .mp-row.mp-selected .mp-pmname{ font-weight:700; color:var(--ink); }\n  .mp-pmname{ width:175px; flex:0 0 auto; font-size:11.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:8px; }\n  .mp-pmtotal{ width:50px; flex:0 0 auto; font-size:10.5px; font-family:\"JetBrains Mono\",monospace; color:var(--ink-2); text-align:right; padding-right:10px; }\n  .mp-strip{ position:relative; flex:1 1 auto; height:16px; background:repeating-linear-gradient(90deg, #262624 0, #262624 27px, #1d1d1b 27px, #1d1d1b 28px); border-radius:3px; }\n  .mp-cell{ position:absolute; top:0; height:16px; }\n  .mp-today{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--kanon-red,#e30613); z-index:3; pointer-events:none; }\n  .mp-total-row{ font-weight:700; border-top:2px solid var(--hair); margin-top:2px; padding-top:2px; }\n  .mp-total-row .mp-strip{ background:repeating-linear-gradient(90deg, #2f2f2c 0, #2f2f2c 27px, #262624 27px, #262624 28px); }\n  .mp-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin:12px 0 0; }\n  .mp-legend .sw{ display:inline-flex; align-items:center; gap:5px; }\n  .mp-legend .sw .box{ width:9px; height:9px; border-radius:3px; }\n  .mp-d0{ background:transparent; }\n  .mp-d1{ background:var(--good); }\n  .mp-d2{ background:var(--warning); }\n  .mp-d3{ background:var(--critical); }\n\n  \u002F* ---------- Kanon brand refinements ---------- *\u002F\n  header.top h1{ text-transform:uppercase; font-weight:800; letter-spacing:0.01em; font-size:20px; }\n  header.top h1 .accent{ color:var(--gold); }\n  .tile .label, .panel h2, .modal-section-title, .detail-field .dlabel, footer.notes h3{ font-weight:700; }\n  .panel h2{ text-transform:uppercase; letter-spacing:0.06em; font-size:12.5px; color:var(--ink); }\n  .tabbtn{ text-transform:uppercase; letter-spacing:0.06em; font-size:11.5px; }\n  .kanon-tagline{ margin-top:12px; padding-top:8px; border-top:1px solid var(--hair); }\n  .kanon-tagline span{ font-size:11px; font-weight:700; letter-spacing:0.32em; text-transform:uppercase; color:var(--gold); }\n  ::selection{ background:var(--gold); color:#0e0e0d; }\n  ::-webkit-scrollbar{ width:10px; height:10px; }\n  ::-webkit-scrollbar-track{ background:#0e0e0d; }\n  ::-webkit-scrollbar-thumb{ background:#3a3a37; }\n  ::-webkit-scrollbar-thumb:hover{ background:#4a4a46; }\n\n  \u002F* ---------- Kiosk \u002F TV mode (?tv=1) ----------\n     For a wall-mounted screen with no keyboard, mouse or remote: hides the\n     pointer, makes tabs visually inert (nothing to click anyway), hides\n     every tab's filter row outright (selects\u002Fsearch\u002Fcheckboxes — none of\n     it is reachable without a mouse or keyboard, so there's no reason to\n     show it), and adds a thin progress bar showing time until the next\n     auto-switch. *\u002F\n  body.kiosk-mode, body.kiosk-mode *{ cursor:none !important; }\n  body.kiosk-mode .tabs,\n  body.kiosk-mode .kpis .tile,\n  body.kiosk-mode #mpResetChip{ pointer-events:none; }\n  body.kiosk-mode .filterbar{ display:none; }\n  \u002F* PM workload and Masterplan are skipped by the auto-rotation (see\n     SEQUENCE below) — hide their tab buttons too so the header doesn't\n     advertise two tabs that never come up on their own. *\u002F\n  body.kiosk-mode #workload-tab-btn,\n  body.kiosk-mode #masterplan-tab-btn{ display:none; }\n  \u002F* The PM name is already the whole point of the \"Active projects by PM\"\n     chart on Overall charts, and dropping it here lets the Dashboard\n     table's other columns (Project, Status, dates) breathe more on a wide\n     TV screen. Interactive use (no ?tv=1) keeps the column. *\u002F\n  body.kiosk-mode table.tracker th:first-child,\n  body.kiosk-mode table.tracker td:first-child{ display:none; }\n  #kiosk-progress{\n    position:fixed; top:0; left:0; height:4px; width:0%;\n    background:var(--gold-hover); z-index:9999;\n  }\n<\u002Fstyle>\n\n\n<\u002Fhead><body><header class=\"top\">\n  <div class=\"row\">\n    <div>\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <h1><span class=\"accent\">Project Management System<\u002Fspan> (PMS) <span style=\"font-size:0.55em; font-weight:600; letter-spacing:0.08em; color:var(--gold-hover);\">— TEST DATA<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta\">\n      Data as of <strong id=\"asof\">–<\u002Fstrong><br>\n      Source: Demo dataset · Fictional projects<br>\n      Scope: <strong>active projects<\u002Fstrong>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tabs\">\n    <button class=\"tabbtn active\" data-tab=\"dashboard\" id=\"dashboard-tab-btn\">Dashboard<\u002Fbutton>\n    <button class=\"tabbtn\" data-tab=\"charts\" id=\"charts-tab-btn\">Overall charts<\u002Fbutton>\n    <button class=\"tabbtn\" data-tab=\"milestones\" id=\"milestones-tab-btn\">Milestones<\u002Fbutton>\n    <button class=\"tabbtn\" data-tab=\"workload\" id=\"workload-tab-btn\">PM workload<\u002Fbutton>\n    <button class=\"tabbtn\" data-tab=\"masterplan\" id=\"masterplan-tab-btn\">Masterplan<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap\">\n\n  <section class=\"kpis\" id=\"kpis\"><\u002Fsection>\n\n  <div id=\"dashboard-tab\">\n    <div class=\"filterbar\" id=\"filterbar\">\n      <select id=\"f-pm\"><option value=\"\">All PMs<\u002Foption><\u002Fselect>\n      <select id=\"f-group\"><option value=\"\">All groups<\u002Foption><\u002Fselect>\n      <select id=\"f-type\"><option value=\"\">All types<\u002Foption><\u002Fselect>\n      <select id=\"f-status\"><option value=\"\">All statuses<\u002Foption><\u002Fselect>\n      <input type=\"search\" id=\"f-search\" placeholder=\"Search customer or project…\">\n      <label class=\"chip checkbox-chip\" id=\"finishedChip\">\n        <input type=\"checkbox\" id=\"f-finished\">\n        Show finished (60 Gereed)\n      <\u002Flabel>\n      <label class=\"chip checkbox-chip\" id=\"showallChip\">\n        <input type=\"checkbox\" id=\"f-showall\">\n        Show all project types (not just P\u002FO)\n      <\u002Flabel>\n      <span class=\"chip reset\" id=\"resetChip\">Reset<\u002Fspan>\n      <span class=\"result-count\" id=\"resultCount\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"table-container\">\n      <table class=\"tracker\" id=\"tracker-table\">\n        <thead>\n          <tr>\n            <th data-key=\"pm\">PM<\u002Fth>\n            <th data-key=\"klant\">Customer<\u002Fth>\n            <th data-key=\"nr\">Project<\u002Fth>\n            <th data-key=\"group\">Group<\u002Fth>\n            <th data-key=\"status\">Status<\u002Fth>\n            <th data-key=\"stage\">Stage<\u002Fth>\n            <th data-key=\"geboekt\">Eng. hours<\u002Fth>\n            <th data-key=\"orderDate\">Order date<\u002Fth>\n            <th data-key=\"kickoff\">Kickoff<\u002Fth>\n            <th data-key=\"ship\">Ship date<\u002Fth>\n            <th data-key=\"released\">Released<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody id=\"tracker-tbody\"><\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div class=\"empty-state\" id=\"emptyState\" hidden=\"\">No projects match these filters.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"charts-tab\" hidden=\"\">\n    <div class=\"charts-grid\">\n      <div class=\"panel\">\n        <h2>Active projects by PM<\u002Fh2>\n        <p class=\"panel-sub\">Count of currently active projects, by project manager — click a name to see their projects<\u002Fp>\n        <div id=\"pmChart\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <h2>Ship date urgency<\u002Fh2>\n        <p class=\"panel-sub\">Active projects by how close their ship date is<\u002Fp>\n        <div id=\"shipChart\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <h2>Active projects by status<\u002Fh2>\n        <p class= 2026-09-08\",\"shipDaysLeft\": -12,\"voorcalc\": 110,\"geboekt\": 106,\"aanneemsom\": 33500,\"fin\": {\"orderDate\": \"2026-04-20\",\"invoiced\": 33500,\"toInvoice\": 0,\"costMaterial\": 13200,\"costHours\": 5300,\"costTotal\": 18500,\"costPrecalc\": 17000,\"hoursBudget\": 110,\"result\": 15000,\"marginPct\": 44.8,\"finReady\": true,\"finReadyDate\": \"2026-09-12\"}},{\"id\": \"P000000016\",\"nr\": \"P100016\",\"desc\": \"Industrial Mixer Unit\",\"pm\": \"Sophie Mulder\",\"klant\": \"Almere Process\",\"group\": \"Standard\",\"type\": \"AA groep 03\",\"status\": \"50 In werkvoorbereiding\",\"code\": 50,\"onhold\": false,\"stage\": 40,\"kickoff\": \"2026-09-15\",\"ship\": \"2026-12-20\",\"planEnd\": \"2026-12-15\",\"released\": null,\"shipDaysLeft\": 89,\"voorcalc\": 200,\"geboekt\": 15,\"aanneemsom\": 71000,\"fin\": {\"orderDate\": \"2026-08-28\",\"invoiced\": 0,\"toInvoice\": 71000,\"costMaterial\": 3000,\"costHours\": 950,\"costTotal\": 3950,\"costPrecalc\": 32500,\"hoursBudget\": 200,\"result\": 67050,\"marginPct\": 94.4,\"finReady\": false,\"finReadyDate\": null}},{\"id\": \"P000000017\",\"nr\": \"P100017\",\"desc\": \"Overhead Crane System\",\"pm\": \"Mark Jansen\",\"klant\": \"Haarlem Heavy Industries\",\"group\": \"Standard\",\"type\": \"AA groep 01\",\"status\": \"40 In productie\",\"code\": 40,\"onhold\": false,\"stage\": 25,\"kickoff\": \"2026-08-20\",\"ship\": \"2026-11-10\",\"planEnd\": \"2026-11-05\",\"released\": null,\"shipDaysLeft\": 49,\"voorcalc\": 230,\"geboekt\": 90,\"aanneemsom\": 86000,\"fin\": {\"orderDate\": \"2026-08-05\",\"invoiced\": 0,\"toInvoice\": 86000,\"costMaterial\": 19500,\"costHours\": 8200,\"costTotal\": 27700,\"costPrecalc\": 40000,\"hoursBudget\": 230,\"result\": 58300,\"marginPct\": 67.8,\"finReady\": false,\"finReadyDate\": null}},{\"id\": \"P000000018\",\"nr\": \"P100018\",\"desc\": \"Water Treatment Skid\",\"pm\": \"Anna de Vries\",\"klant\": \"Apeldoorn Water\",\"group\": \"Standard\",\"type\": \"AA groep 02\",\"status\": \"52 Deels gefactureerd\",\"code\": 52,\"onhold\": false,\"stage\": 65,\"kickoff\": \"2026-06-10\",\"ship\": \"2026-09-12\",\"planEnd\": \"2026-10-05\",\"released\": null,\"shipDaysLeft\": -10,\"voorcalc\": 165,\"geboekt\": 150,\"aanneemsom\": 58000,\"fin\": {\"orderDate\": \"2026-05-25\",\"invoiced\": 29000,\"toInvoice\": 29000,\"costMaterial\": 21500,\"costHours\": 9100,\"costTotal\": 30600,\"costPrecalc\": 28000,\"hoursBudget\": 165,\"result\": 27400,\"marginPct\": 47.2,\"finReady\": false,\"finReadyDate\": null}},{\"id\": \"P000000019\",\"nr\": \"P100019\",\"desc\": \"Solar Inverter Rack\",\"pm\": \"Peter Bakker\",\"klant\": \"Venlo Renewables\",\"group\": \"Standard\",\"type\": \"AA groep 01\",\"status\": \"20 Order ontvangen\",\"code\": 20,\"onhold\": false,\"stage\": 10,\"kickoff\": \"2026-11-15\",\"ship\": \"2027-05-01\",\"planEnd\": \"2027-05-01\",\"released\": null,\"shipDaysLeft\": 251,\"voorcalc\": 80,\"geboekt\": 0,\"aanneemsom\": 24000,\"fin\": {\"orderDate\": \"2026-09-19\",\"invoiced\": 0,\"toInvoice\": 24000,\"costMaterial\": 0,\"costHours\": 0,\"costTotal\": 0,\"costPrecalc\": 10500,\"hoursBudget\": 80,\"result\": 24000,\"marginPct\": 100.0,\"finReady\": false,\"finReadyDate\": null}},{\"id\": \"P000000020\",\"nr\": \"P100020\",\"desc\": \"Bulk Material Handler\",\"pm\": \"Sophie Mulder\",\"klant\": \"Enschede Bulk Systems\",\"group\": \"Standard\",\"type\": \"AA groep 03\",\"status\": \"55 Verzonden\",\"code\": 55,\"onhold\": false,\"stage\": 90,\"kickoff\": \"2026-07-01\",\"ship\": \"2026-09-05\",\"planEnd\": \"2026-09-05\",\"released\": null,\"shipDaysLeft\": -17,\"voorcalc\": 190,\"geboekt\": 185,\"aanneemsom\": 67000,\"fin\": {\"orderDate\": \"2026-06-18\",\"invoiced\": 67000,\"toInvoice\": 0,\"costMaterial\": 26000,\"costHours\": 11200,\"costTotal\": 37200,\"costPrecalc\": 34500,\"hoursBudget\": 190,\"result\": 29800,\"marginPct\": 44.5,\"finReady\": false,\"finReadyDate\": null}}]<\u002Fscript>\n<script>\n(function(){\n  const ROWS = JSON.parse(document.getElementById('tracker-data').textContent);\n  \u002F\u002F Convenience top-level alias so Order date (Trimergo's Opdrachtdatum,\n  \u002F\u002F nested under fin) can be sorted\u002Frendered the same way as the other\n  \u002F\u002F milestone dates (kickoff, ship, released) instead of needing a special\n  \u002F\u002F case everywhere those are handled.\n  ROWS.forEach(r => { r.orderDate = r.fin ? r.fin.orderDate : null; });\n  const TODAY_STR = '22 Sep 2026';\n  document.getElementById('asof').textContent = TODAY_STR;\n\n  const fmtInt = n => n.toLocaleString('en-US');\n\n  \u002F\u002F ---------- status -> severity class (for the Status pill) ----------\n  function statusClass(row){\n    if (row.onhold) return 'status-hold';\n    if (row.code === 60) return 'status-good';\n    if (row.code === 59.5 || row.code === 55) return 'status-good';\n    if (row.code === 39) return 'status-neutral';\n    return 'status-warning';\n  }\n  function stageBarClass(row){\n    return row.stage === 100 ? 'done' : '';\n  }\n\n  function fmtDate(s){\n    if (!s) return '—';\n    const [y,m,d] = s.split('-');\n    return d + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m,10)-1] + ' ' + y.slice(2);\n  }\n\n  \u002F\u002F Estimated (pre-calculated) vs. used (booked) engineering hours. Most\n  \u002F\u002F Spares\u002FService jobs don't track hours at all, so both being 0 just means\n  \u002F\u002F \"not tracked\" rather than \"zero work\" — shown as a dash, not \"0h \u002F 0h\".\n  function hoursLabel(r){\n    const est = r.voorcalc || 0, used = r.geboekt || 0;\n    if (est === 0 && used === 0) return '<span class=\"stage-label\">—<\u002Fspan>';\n    return `${Math.round(est)}h <span class=\"hours-sep\">\u002F<\u002Fspan> ${Math.round(used)}h`;\n  }\n\n  \u002F\u002F ---------- scope: P\u002FO-numbered projects only, unless \"show all\" is checked ----------\n  function isPO(r){\n    const t = (r.nr || '').trim().toUpperCase();\n    return t.charAt(0) === 'P' || t.charAt(0) === 'O';\n  }\n  function getScopedRows(){\n    const showFinished = document.getElementById('f-finished').checked;\n    const showAllTypes = document.getElementById('f-showall').checked;\n    let rows = showFinished ? ROWS : ROWS.filter(r => r.code !== 60);\n    if (!showAllTypes) rows = rows.filter(isPO);\n    return rows;\n  }\n\n  \u002F\u002F Same P\u002FO-type scope the KPI tiles use (ignores the \"hide finished\"\n  \u002F\u002F browse toggle, same as renderKPIs' kpiBase) — a PM whose only projects\n  \u002F\u002F are finished should still show up so their history stays reachable.\n  function dashboardAvailablePMs(){\n    const showAllTypes = document.getElementById('f-showall').checked;\n    const scoped = showAllTypes ? ROWS : ROWS.filter(isPO);\n    return [...new Set(scoped.map(r => r.pm).filter(Boolean))].sort();\n  }\n  function rebuildDashboardPMOptions(){\n    const pmSel = document.getElementById('f-pm');\n    const currentPM = pmSel.value;\n    const availablePMs = dashboardAvailablePMs();\n    pmSel.innerHTML = '<option value=\"\">All PMs<\u002Foption>';\n    fillSelect('f-pm', availablePMs);\n    pmSel.value = availablePMs.includes(currentPM) ? currentPM : '';\n  }\n\n  \u002F\u002F ---------- KPI tiles (clickable quick filters) ----------\n  \u002F\u002F quickFilter is one of: null | 'active' | 'overdue' | 'soon' | 'onhold' | 'done'\n  let quickFilter = null;\n  \u002F\u002F These three tabs never look at quickFilter at all (Workload\u002FMasterplan\n  \u002F\u002F only use their own PM + \"show all types\" filters; Overall charts is\n  \u002F\u002F built straight from getScopedRows()), so a KPI tile click there would\n  \u002F\u002F visually \"activate\" with no visible effect on the page. Disabling the\n  \u002F\u002F tiles on those tabs avoids that dead-end interaction.\n  const KPI_INERT_TABS = ['workload', 'masterplan', 'charts'];\n  let currentTab = 'dashboard';\n  function quickFilterMatches(r){\n    switch(quickFilter){\n      case 'active': return !r.onhold && !r.released;\n      case 'overdue': return !r.onhold && !r.released && r.shipDaysLeft !== null && r.shipDaysLeft < 0;\n      case 'soon': return !r.onhold && !r.released && r.shipDaysLeft !== null && r.shipDaysLeft >= 0 && r.shipDaysLeft <= 14;\n      case 'onhold': return !!r.onhold;\n      case 'done': return r.stage >= 95;\n      default: return true;\n    }\n  }\n  function renderKPIs(rows){\n    \u002F\u002F These five tiles are definitive counts that ignore the \"hide\n    \u002F\u002F finished\" browse toggle (see applyFilters()), but they still respect\n    \u002F\u002F the P\u002FO \"show all types\" scope, since that one is controlled solely\n    \u002F\u002F by its checkbox — otherwise the number on a tile wouldn't match what\n    \u002F\u002F clicking that tile actually reveals in the table below. \"Active\n    \u002F\u002F projects\" used to be computed from the (hide-finished-respecting)\n    \u002F\u002F `rows` argument instead, which is why its number could drift from\n    \u002F\u002F the \"X of Y\" count shown once you clicked it — same underlying data,\n    \u002F\u002F two different scopes. It's now on the same footing as the other four.\n    const showAllTypesForKPIs = document.getElementById('f-showall').checked;\n    const kpiBase = showAllTypesForKPIs ? ROWS : ROWS.filter(isPO);\n    const onHold = kpiBase.filter(r=>r.onhold).length;\n    const openRows = kpiBase.filter(r=>!r.onhold && !r.released);\n    const total = openRows.length;\n    const distinctPMs = new Set(openRows.map(r=>r.pm)).size;\n    const overdueShip = openRows.filter(r=>r.shipDaysLeft !== null && r.shipDaysLeft < 0).length;\n    const dueSoon = openRows.filter(r=>r.shipDaysLeft !== null && r.shipDaysLeft >= 0 && r.shipDaysLeft <= 14).length;\n    const nearlyDone = kpiBase.filter(r=>r.stage>=95).length;\n    const isActive = (key) => quickFilter === key ? ' active' : '';\n    const inert = KPI_INERT_TABS.includes(currentTab);\n    const disabledAttr = inert ? ' disabled' : '';\n    const hint = (key) => inert\n      ? 'Doesn\\'t affect this tab'\n      : (quickFilter===key ? 'Filtering — click to clear' : 'Click to filter');\n\n    document.getElementById('kpis').classList.toggle('kpis-inert', inert);\n    document.getElementById('kpis').innerHTML = `\n      <button class=\"tile clickable${isActive('active')}\" data-filter=\"active\" type=\"button\"${disabledAttr}>\n        <div class=\"label\">Active projects<\u002Fdiv>\n        <div class=\"value tab-nums\">${fmtInt(total)}<\u002Fdiv>\n        <div class=\"sub\">${distinctPMs} project managers<\u002Fdiv>\n        <div class=\"tile-hint\">${hint('active')}<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"tile warn clickable${isActive('overdue')}\" data-filter=\"overdue\" type=\"button\"${disabledAttr}>\n        <div class=\"label\">Ship date overdue<\u002Fdiv>\n        <div class=\"value tab-nums\">${fmtInt(overdueShip)}<\u002Fdiv>\n        <div class=\"sub\">not yet released, past ship date<\u002Fdiv>\n        <div class=\"tile-hint\">${hint('overdue')}<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"tile clickable${isActive('soon')}\" data-filter=\"soon\" type=\"button\"${disabledAttr}>\n        <div class=\"label\">Shipping within 14 days<\u002Fdiv>\n        <div class=\"value tab-nums\">${fmtInt(dueSoon)}<\u002Fdiv>\n        <div class=\"sub\">worth a status check now<\u002Fdiv>\n        <div class=\"tile-hint\">${hint('soon')}<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"tile clickable${isActive('onhold')}\" data-filter=\"onhold\" type=\"button\"${disabledAttr}>\n        <div class=\"label\">On hold<\u002Fdiv>\n        <div class=\"value tab-nums\">${fmtInt(onHold)}<\u002Fdiv>\n        <div class=\"sub\">flagged \"35 ON HOLD\"<\u002Fdiv>\n        <div class=\"tile-hint\">${hint('onhold')}<\u002Fdiv>\n      <\u002Fbutton>\n      <button class=\"tile clickable${isActive('done')}\" data-filter=\"done\" type=\"button\"${disabledAttr}>\n        <div class=\"label\">Nearly \u002F fully done<\u002Fdiv>\n        <div class=\"value tab-nums\">${fmtInt(nearlyDone)}<\u002Fdiv>\n        <div class=\"sub\">stage 95%+, not yet archived<\u002Fdiv>\n        <div class=\"tile-hint\">${hint('done')}<\u002Fdiv>\n      <\u002Fbutton>\n    `;\n  }\n  renderKPIs(getScopedRows());\n  document.getElementById('kpis').addEventListener('click', (e) => {\n    const tile = e.target.closest('.tile[data-filter]');\n    if (!tile || tile.disabled) return;\n    const f = tile.dataset.filter;\n    quickFilter = (quickFilter === f) ? null : f;\n    renderKPIs(getScopedRows());\n    applyFilters();\n    \u002F\u002F The KPI tiles sit above every tab, not just the Dashboard, so a quick\n    \u002F\u002F filter needs to reach the Milestones tab's table and Gantt too.\n    if (milestonesRendered) applyMsFilters();\n  });\n\n  \u002F\u002F ---------- tabs ----------\n  document.getElementById('dashboard-tab-btn').addEventListener('click', () => switchTab('dashboard'));\n  document.getElementById('charts-tab-btn').addEventListener('click', () => switchTab('charts'));\n  document.getElementById('milestones-tab-btn').addEventListener('click', () => switchTab('milestones'));\n  document.getElementById('workload-tab-btn').addEventListener('click', () => switchTab('workload'));\n  document.getElementById('masterplan-tab-btn').addEventListener('click', () => switchTab('masterplan'));\n  function switchTab(name){\n    currentTab = name;\n    document.getElementById('dashboard-tab').hidden = name !== 'dashboard';\n    document.getElementById('charts-tab').hidden = name !== 'charts';\n    document.getElementById('milestones-tab').hidden = name !== 'milestones';\n    document.getElementById('workload-tab').hidden = name !== 'workload';\n    document.getElementById('masterplan-tab').hidden = name !== 'masterplan';\n    document.getElementById('dashboard-tab-btn').classList.toggle('active', name==='dashboard');\n    document.getElementById('charts-tab-btn').classList.toggle('active', name==='charts');\n    document.getElementById('milestones-tab-btn').classList.toggle('active', name==='milestones');\n    document.getElementById('workload-tab-btn').classList.toggle('active', name==='workload');\n    document.getElementById('masterplan-tab-btn').classList.toggle('active', name==='masterplan');\n    renderKPIs(getScopedRows());\n    if (name === 'charts') renderCharts();\n    if (name === 'milestones') renderMilestonesTab();\n    if (name === 'workload') renderWorkloadTab();\n    if (name === 'masterplan') renderMasterplanTab();\n  }\n\n  \u002F\u002F ---------- filter dropdowns ----------\n  function uniqueSorted(key){ return [...new Set(ROWS.map(r=>r[key]).filter(Boolean))].sort(); }\n  function fillSelect(id, values){\n    const sel = document.getElementById(id);\n    values.forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });\n  }\n  fillSelect('f-pm', dashboardAvailablePMs());\n  fillSelect('f-group', uniqueSorted('group'));\n  fillSelect('f-type', uniqueSorted('type'));\n  fillSelect('f-status', uniqueSorted('status'));\n\n  \u002F\u002F ---------- table render ----------\n  const tbody = document.getElementById('tracker-tbody');\n  let sortKey = 'nr', sortDir = 1;\n  let filtered = ROWS.slice();\n  let baseCount = ROWS.length;\n\n  function applyFilters(){\n    const pm = document.getElementById('f-pm').value;\n    const group = document.getElementById('f-group').value;\n    const type = document.getElementById('f-type').value;\n    const status = document.getElementById('f-status').value;\n    const q = document.getElementById('f-search').value.trim().toLowerCase();\n    const showFinished = document.getElementById('f-finished').checked;\n    const showAllTypes = document.getElementById('f-showall').checked;\n    \u002F\u002F Finished (60 Gereed) projects are hidden by default; an explicit status\n    \u002F\u002F filter for \"60 Gereed\" always shows them regardless of the checkbox.\n    \u002F\u002F Only P- and O-numbered projects are shown by default; the rest\n    \u002F\u002F (Spares\u002FService jobs) stay hidden unless \"show all\" is checked.\n    \u002F\u002F EXCEPTION: a KPI quick-filter (Ship date overdue \u002F Shipping within 14\n    \u002F\u002F days \u002F On hold \u002F Nearly-fully done \u002F Active) is a definitive,\n    \u002F\u002F company-wide count — it must not be silently narrowed by these two\n    \u002F\u002F browse-scope toggles, or the tile's own number won't match what\n    \u002F\u002F clicking it reveals. So when a quick filter is active, start from\n    \u002F\u002F every row and let quickFilterMatches() do all the work.\n    let base = quickFilter\n      ? ROWS\n      : ((showFinished || status === '60 Gereed') ? ROWS : ROWS.filter(r => r.code !== 60));\n    \u002F\u002F The P\u002FO-numbered-only scope is controlled solely by the \"show all\n    \u002F\u002F types\" checkbox — it always applies, even while a KPI quick-filter is\n    \u002F\u002F active. Only the \"hide finished\" scope is bypassed by a quick filter.\n    if (!showAllTypes) base = base.filter(isPO);\n    baseCount = base.length;\n    filtered = base.filter(r =>\n      (!pm || r.pm===pm) && (!group || r.group===group) && (!type || r.type===type) &&\n      (!status || r.status===status) &&\n      (!q || (r.klant+' '+r.nr+' '+r.desc).toLowerCase().includes(q)) &&\n      quickFilterMatches(r)\n    );\n    sortRows();\n    renderTable();\n  }\n\n  \u002F\u002F Project numbers (e.g. \"R040007\", \"P000003209\") are a letter prefix plus\n  \u002F\u002F a zero-padded number, and those numbers vary in digit-length across\n  \u002F\u002F prefixes — a plain string compare would put \"R1200\" before \"R400\"\n  \u002F\u002F (1 < 4 as the first digit) even though 1200 is the bigger number. This\n  \u002F\u002F splits the prefix from the digits and compares the digits as integers,\n  \u002F\u002F so \"low to high number\" means the actual number, not lexical order.\n  function projNumParts(nr){\n    const m = \u002F^([A-Za-z]*)(\\d+)$\u002F.exec(nr || '');\n    if (!m) return { prefix: (nr || ''), num: -1 };\n    return { prefix: m[1], num: parseInt(m[2], 10) };\n  }\n  function compareRowValues(av, bv, key){\n    if (key === 'nr'){\n      const A = projNumParts(av), B = projNumParts(bv);\n      if (A.prefix !== B.prefix) return A.prefix < B.prefix ? -1 : 1;\n      return A.num - B.num;\n    }\n    if (av < bv) return -1;\n    if (av > bv) return 1;\n    return 0;\n  }\n\n  function sortRows(){\n    filtered.sort((a,b) => {\n      let av = a[sortKey], bv = b[sortKey];\n      if (av === null || av === undefined) av = '';\n      if (bv === null || bv === undefined) bv = '';\n      return compareRowValues(av, bv, sortKey) * sortDir;\n    });\n  }\n\n  function renderTable(){\n    if (filtered.length === 0){\n      tbody.innerHTML = '';\n      document.getElementById('emptyState').hidden = false;\n    } else {\n      document.getElementById('emptyState').hidden = true;\n      tbody.innerHTML = filtered.map(r => `\n        <tr class=\"${r.onhold?'onhold':''}\" data-id=\"${escapeAttr(r.id)}\">\n          <td>${escapeHtml(r.pm)}<\u002Ftd>\n          <td>${escapeHtml(r.klant)}<\u002Ftd>\n          <td class=\"proj-cell\"><span class=\"nr\">${escapeHtml(r.nr)}<\u002Fspan><span class=\"desc\" title=\"${escapeAttr(r.desc)}\">${escapeHtml(r.desc)}<\u002Fspan><\u002Ftd>\n          <td>${escapeHtml(r.group)}<\u002Ftd>\n          <td><span class=\"status-pill ${statusClass(r)}\"><span class=\"dot\"><\u002Fspan>${escapeHtml(r.status)}<\u002Fspan><\u002Ftd>\n          <td>${r.onhold ? '<span class=\"stage-label\">on hold<\u002Fspan>' : `<div class=\"stage-track\"><div class=\"stage-fill ${stageBarClass(r)}\" style=\"width:${r.stage}%;\"><\u002Fdiv><\u002Fdiv><div class=\"stage-label\">${r.stage}%<\u002Fdiv>`}<\u002Ftd>\n          <td class=\"hours-cell${(r.voorcalc>0 && r.geboekt>r.voorcalc) ? ' over' : ''}\">${hoursLabel(r)}<\u002Ftd>\n          <td class=\"date-cell ${r.orderDate?'':'empty'}\">${fmtDate(r.orderDate)}<\u002Ftd>\n          <td class=\"date-cell ${r.kickoff?'':'empty'}\">${fmtDate(r.kickoff)}<\u002Ftd>\n          <td class=\"date-cell ${r.ship?'':'empty'}\">${fmtDate(r.ship)}<\u002Ftd>\n          <td class=\"date-cell ${r.released?'':'empty'}\">${fmtDate(r.released)}<\u002Ftd>\n        <\u002Ftr>`).join('');\n    }\n    document.getElementById('resultCount').textContent = filtered.length + ' of ' + baseCount + ' projects';\n    document.querySelectorAll('#tracker-table thead th').forEach(th => {\n      th.querySelector('.arrow')?.remove();\n      if (th.dataset.key === sortKey){\n        const a = document.createElement('span'); a.className='arrow'; a.textContent = sortDir===1 ? '▲' : '▼';\n        th.appendChild(a);\n      }\n    });\n  }\n\n  document.querySelectorAll('#tracker-table thead th').forEach(th => {\n    th.addEventListener('click', () => {\n      const key = th.dataset.key;\n      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }\n      sortRows(); renderTable();\n    });\n  });\n\n  ['f-pm','f-group','f-type','f-status'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));\n  document.getElementById('f-search').addEventListener('input', applyFilters);\n\n  \u002F\u002F Changing either scope checkbox affects the whole view: the table, the\n  \u002F\u002F KPI tiles, and (if open) the charts — not just the dashboard table.\n  function onScopeChange(){\n    rebuildDashboardPMOptions();\n    applyFilters();\n    renderKPIs(getScopedRows());\n    chartsRendered = false;\n    if (!document.getElementById('charts-tab').hidden) renderCharts();\n  }\n  document.getElementById('f-finished').addEventListener('change', onScopeChange);\n  document.getElementById('f-showall').addEventListener('change', onScopeChange);\n  document.getElementById('resetChip').addEventListener('click', () => {\n    ['f-pm','f-group','f-type','f-status'].forEach(id => document.getElementById(id).value='');\n    document.getElementById('f-search').value='';\n    document.getElementById('f-finished').checked = false;\n    document.getElementById('f-showall').checked = false;\n    quickFilter = null;\n    onScopeChange();\n    if (milestonesRendered) applyMsFilters();\n  });\n\n  function escapeHtml(s){ return (s==null?'':String(s)).replace(\u002F[&<>]\u002Fg, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }\n  function escapeAttr(s){ return escapeHtml(s).replace(\u002F\"\u002Fg,'&quot;'); }\n\n  applyFilters();\n\n  \u002F\u002F ---------- project detail modal ----------\n  const TODAY = new Date('2026-09-22T00:00:00');\n  const ROWS_BY_ID = {};\n  ROWS.forEach(r => { ROWS_BY_ID[r.id] = r; });\n\n  function fmtMoney(v, cur){\n    if (v === null || v === undefined) return '—';\n    const n = Number(v);\n    const s = n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});\n    return cur === 'EUR' ? ('€ ' + s) : (s + ' ' + (cur || ''));\n  }\n  function daysBetween(a, b){\n    return Math.round((a - b) \u002F 86400000);\n  }\n  function statusPillHtml(r){\n    return `<span class=\"status-pill ${statusClass(r)}\" title=\"${escapeAttr(r.status)}\"><span class=\"dot\"><\u002Fspan><span class=\"label\">${escapeHtml(r.status)}<\u002Fspan><\u002Fspan>`;\n  }\n\n  \u002F\u002F Real payment terms, straight from Trimergo's own dates: the span between\n  \u002F\u002F an invoice's invoice date and its due date IS the payment term (net 30,\n  \u002F\u002F net 60, etc.) — no separate lookup needed, and it can't drift from what\n  \u002F\u002F Trimergo actually billed on. 0 days means payable on\u002Fbefore invoicing\n  \u002F\u002F (typically an advance-payment line).\n  function paymentTermsLabel(inv){\n    if (!inv.date || !inv.due) return '—';\n    const d = daysBetween(new Date(inv.due+'T00:00:00'), new Date(inv.date+'T00:00:00'));\n    if (d <= 0) return 'Due on invoicing';\n    return `Net ${d}d`;\n  }\n\n  function invoiceRowHtml(inv){\n    const invDate = inv.date ? new Date(inv.date+'T00:00:00') : null;\n    const dueDate = inv.due ? new Date(inv.due+'T00:00:00') : null;\n    let pillHtml, agingHtml;\n    if (inv.paid){\n      pillHtml = `<span class=\"paid-pill paid-yes\"><span class=\"dot\"><\u002Fspan>Paid<\u002Fspan>`;\n      agingHtml = '—';\n    } else {\n      const overdue = dueDate ? daysBetween(TODAY, dueDate) : null; \u002F\u002F >0 means past due\n      const openDays = invDate ? daysBetween(TODAY, invDate) : null; \u002F\u002F days since invoiced\n      const isOverdue = overdue !== null && overdue > 0;\n      \u002F\u002F Green while still within the agreed payment term (not yet past its due\n      \u002F\u002F date); flips to red only once that term has actually run out.\n      pillHtml = `<span class=\"paid-pill paid-no ${isOverdue ? '' : 'aging-ok'}\"><span class=\"dot\"><\u002Fspan>${isOverdue ? 'Overdue' : 'Within terms'}<\u002Fspan>`;\n      if (isOverdue) agingHtml = `${overdue}d overdue`;\n      else if (overdue !== null) agingHtml = `due in ${-overdue}d`;\n      else agingHtml = openDays !== null ? `open ${openDays}d` : '—';\n    }\n    const termsText = inv.terms ? inv.terms : '—';\n    return `\n      <tr>\n        <td class=\"mono\">${escapeHtml(inv.nr)}<\u002Ftd>\n        <td class=\"terms\" title=\"${escapeAttr(termsText)}\">${escapeHtml(termsText)}<\u002Ftd>\n        <td class=\"terms-pill\">${paymentTermsLabel(inv)}<\u002Ftd>\n        <td class=\"date-cell\">${fmtDate(inv.date)}<\u002Ftd>\n        <td class=\"date-cell\">${fmtDate(inv.due)}<\u002Ftd>\n        <td class=\"num\">${fmtMoney(inv.amt, inv.cur)}<\u002Ftd>\n        <td>${pillHtml}<\u002Ftd>\n        <td class=\"num\">${inv.paid ? '—' : fmtMoney(inv.open, inv.cur)}<\u002Ftd>\n        <td>${agingHtml}<\u002Ftd>\n      <\u002Ftr>`;\n  }\n\n  \u002F\u002F ---------- risk flags ----------\n  function riskFlagsHtml(r){\n    const flags = [];\n    if (r.onhold) flags.push(['flag-hold', 'On hold']);\n    if (!r.released){\n      if (r.shipDaysLeft < 0) flags.push(['flag-critical', `${Math.abs(r.shipDaysLeft)}d past ship date`]);\n      else if (r.shipDaysLeft <= 7) flags.push(['flag-warning', `Ships in ${r.shipDaysLeft}d`]);\n    }\n    if (r.code === 60 && r.aanneemsom > 0 && (!r.inv || r.inv.length === 0)){\n      flags.push(['flag-warning', 'Finished but never invoiced']);\n    }\n    const invs = r.inv || [];\n    const overdueCount = invs.filter(i => {\n      if (i.paid || !i.due) return false;\n      return daysBetween(TODAY, new Date(i.due+'T00:00:00')) > 0;\n    }).length;\n    if (overdueCount > 0) flags.push(['flag-critical', `${overdueCount} overdue invoice${overdueCount===1?'':'s'}`]);\n    const f = r.fin;\n    if (f && f.marginPct !== null && f.marginPct !== undefined){\n      if (f.marginPct < 0) flags.push(['flag-critical', 'Negative margin']);\n      else if (f.marginPct < 0.10) flags.push(['flag-warning', 'Margin below 10%']);\n    }\n    if (flags.length === 0) return '';\n    return `<div class=\"flags-row\">${flags.map(([cls,text]) => `<span class=\"flag-chip ${cls}\">${escapeHtml(text)}<\u002Fspan>`).join('')}<\u002Fdiv>`;\n  }\n\n  \u002F\u002F ---------- timeline visual ----------\n  function timelineHtml(r){\n    const parseD = (s) => s ? new Date(s+'T00:00:00') : null;\n    const k = parseD(r.kickoff);\n    if (!k) return '';\n    const sh = parseD(r.ship);\n    const pe = parseD(r.planEnd);\n    const rel = parseD(r.released);\n    const candidates = [sh, pe, rel, TODAY].filter(Boolean);\n    let end = candidates.length ? new Date(Math.max.apply(null, candidates.map(d => d.getTime()))) : k;\n    if (end.getTime() <= k.getTime()) end = new Date(k.getTime() + 86400000);\n    const span = end.getTime() - k.getTime();\n    const pct = (d) => Math.max(0, Math.min(100, ((d.getTime() - k.getTime()) \u002F span) * 100));\n
